{id:'select-k-best', name:'SelectKBest', pyClass:'SelectKBest / SelectPercentile', family:'Feature Selection', difficulty:'intermediate', days:[6],
blurb:'Keeps only the top K features ranked by a fast, independent statistical score.',
related:['feature-selection','rfe','select-from-model'],
body:`
## What is SelectKBest?
A filter-based feature selection tool that scores every feature independently using a statistical test, then keeps only the top \`k\` highest-scoring features. \`SelectPercentile\` works the same way but keeps the top percentage instead of a fixed count.

## Intuition
Before training any model, quickly ask "which features individually relate most strongly to the target?" and drop the rest — fast, simple, and a good first pass before more expensive methods.

## How it works
Computes a score function per feature (e.g. \`f_classif\` — ANOVA F-value for classification, \`f_regression\` for regression, \`mutual_info_classif\`/\`mutual_info_regression\` for non-linear relationships) and ranks features by that score.

## When should I use it?
As a fast, cheap first pass on high-dimensional data, especially when you want a quick sense of which individual features matter most before investing in slower wrapper methods.

## When should I avoid it?
Features that only matter in combination (interaction effects) won't be captured — each feature is scored independently, so this method is blind to interactions.

## Important Parameters
- \`score_func\` — \`f_classif\`, \`f_regression\`, \`mutual_info_classif\`, \`mutual_info_regression\`, \`chi2\` (for non-negative features).
- \`k\` — number of features to keep (\`SelectKBest\`), or \`percentile\` (\`SelectPercentile\`).

## Training
\`\`\`python
from sklearn.feature_selection import SelectKBest, f_classif

selector = SelectKBest(score_func=f_classif, k=20)
X_selected = selector.fit_transform(X_train, y_train)
selected_columns = X_train.columns[selector.get_support()]
\`\`\`

## Common Mistakes
> ❌ Fitting the selector on the full dataset (train+test) before splitting — leakage, same as any other preprocessing step.
> ❌ Using \`chi2\` on features that include negative values — it requires non-negative input.

## Comparison
Much faster than \`RFE\`/\`RFECV\` since it never retrains a model, but blind to feature interactions that a wrapper method (which actually fits a model) can capture.

## Quick Revision
See box below.

## Practice
Quiz below.
`,

quiz:[{q:'What is the main limitation of SelectKBest compared to wrapper methods like RFE?',

explain:'Filter methods evaluate one feature at a time; interaction effects between features are invisible to this approach.'}]
},

{id:'rfe', name:'Recursive Feature Elimination', pyClass:'RFE / RFECV', family:'Feature Selection', difficulty:'intermediate', days:[6],
blurb:'Repeatedly fits a model, drops the weakest feature, and repeats — accounts for feature interactions.',
related:['select-k-best','select-from-model'],
body:`
## What is RFE?
A wrapper feature-selection method that repeatedly trains a model, ranks features by importance (coefficients or tree importances), removes the least important one, and repeats — until the desired number of features remains. \`RFECV\` adds cross-validation to automatically pick the optimal number of features rather than requiring you to specify it.

## Intuition
Unlike filter methods, RFE actually uses a real model's judgment of feature importance at each step, and re-evaluates after every removal — this lets it account for how features interact, since removing one feature changes how important the others become.

## How it works
1. Fit the estimator on all current features.
2. Rank features by importance (coefficient magnitude or tree importance).
3. Remove the least important feature(s).
4. Repeat until the target number of features remains.

## When should I use it?
You suspect feature interactions matter, and you have the compute budget for repeated model fits (it's much more expensive than a filter method).

## When should I avoid it?
Very large feature sets or expensive-to-train base models — the repeated re-fitting can get costly fast; consider a filter method as a first cheap pass instead.

## Important Parameters
- \`estimator\` — the model used to rank feature importance (must expose \`coef_\` or \`feature_importances_\`).
- \`n_features_to_select\` — how many features to keep (RFE), or let \`RFECV\` find the optimum automatically via cross-validation.

## Training
\`\`\`python
from sklearn.feature_selection import RFECV
from sklearn.ensemble import RandomForestClassifier

selector = RFECV(estimator=RandomForestClassifier(random_state=42), cv=5, scoring="f1")
selector.fit(X_train, y_train)
print("Optimal features:", selector.n_features_)
X_selected = selector.transform(X_train)
\`\`\`

## Common Mistakes
> ❌ Using an expensive estimator (like a large Gradient Boosting model) as the base for RFE on a big feature set — the repeated re-fitting becomes very slow.
> ❌ Fitting on the full dataset before splitting.

## Comparison
More thorough than filter methods (accounts for interactions via re-fitting), but significantly more computationally expensive. \`RFECV\` is generally preferred over plain \`RFE\` since it also tells you the optimal feature count instead of requiring a guess.

## Quick Revision
See box below.

## Practice
Quiz below.
`,

},

{id:'select-from-model', name:'SelectFromModel', pyClass:'SelectFromModel', family:'Feature Selection', difficulty:'intermediate', days:[6],
blurb:'Uses a model\'s own built-in importance/coefficients to select features — fast and interaction-aware.',
related:['rfe','select-k-best','lasso'],
body:`
## What is SelectFromModel?
An embedded feature-selection method that fits a single model once, then keeps only the features whose importance (coefficient magnitude, or tree feature importance) exceeds a threshold — no repeated re-fitting required, unlike RFE.

## Intuition
Some models naturally produce a usable importance score as a side effect of training (Lasso's coefficients, a Random Forest's feature importances). SelectFromModel just reads that off after a single fit, rather than iterating like RFE.

## How it works
Fits the given estimator once on the full feature set, then keeps any feature whose importance/coefficient magnitude is above a threshold (default: the mean importance across all features, or a custom value).

## When should I use it?
You already plan to use a model that naturally produces feature importances (Lasso, Random Forest, Gradient Boosting) and want cheap, one-shot feature selection without RFE's repeated-fitting cost.

## When should I avoid it?
The chosen estimator's importance metric is known to be unreliable for your data type (e.g. raw tree \`feature_importances_\` can be biased toward high-cardinality features — consider permutation importance to validate first).

## Important Parameters
- \`estimator\` — must expose \`coef_\` or \`feature_importances_\` after fitting.
- \`threshold\` — \`"mean"\` (default), \`"median"\`, or a specific numeric cutoff.

## Training
\`\`\`python
from sklearn.feature_selection import SelectFromModel
from sklearn.ensemble import RandomForestClassifier

selector = SelectFromModel(RandomForestClassifier(n_estimators=300, random_state=42), threshold="median")
selector.fit(X_train, y_train)
X_selected = selector.transform(X_train)
print("Kept:", selector.get_support().sum(), "of", X_train.shape[1])
\`\`\`

## Common Mistakes
> ❌ Using the default \`"mean"\` threshold without checking how many features it actually keeps — it can be surprisingly aggressive or lenient depending on the importance distribution.
> ❌ Trusting raw tree importances blindly for high-cardinality categorical features.

## Comparison
Faster than RFE (a single fit instead of many), but less thorough since it doesn't re-evaluate importance after removing features one at a time.

## Quick Revision
See box below.

## Practice
Quiz below.

{id:'scalers', name:'Scalers', pyClass:'StandardScaler / MinMaxScaler / RobustScaler', family:'Preprocessing', difficulty:'beginner', days:[6],
blurb:'The three core sklearn scaling tools — quick reference for when to use each.',

body:`
## Quick Reference
For the full concept (why scaling matters, which models need it), see the **Feature Scaling** lesson in General ML. This page is the sklearn-specific quick reference for the three implementations.

## StandardScaler
Transforms to mean 0, standard deviation 1. The best default choice for most cases.
\`\`\`python
from sklearn.preprocessing import StandardScaler
scaler = StandardScaler()
X_train_scaled = scaler.fit_transform(X_train)
X_test_scaled = scaler.transform(X_test)
\`\`\`

## MinMaxScaler
Transforms to a fixed range, usually [0, 1]. Sensitive to outliers (a single extreme value compresses everything else into a tiny sub-range).
\`\`\`python
from sklearn.preprocessing import MinMaxScaler
scaler = MinMaxScaler(feature_range=(0, 1))
\`\`\`

## RobustScaler
Uses the median and interquartile range (IQR) instead of mean/std — much less sensitive to outliers than the other two.
\`\`\`python
from sklearn.preprocessing import RobustScaler
scaler = RobustScaler()
\`\`\`

## Common Mistakes
> ❌ Using MinMaxScaler on data with significant outliers — a single extreme value squashes the useful range for everything else. Prefer RobustScaler there.
> ❌ Fitting any scaler on the full dataset instead of train only (see Data Leakage).

## Quick Revision
See box below.

## Quick Reference
For the full concept (nominal vs ordinal, when to use each), see the **Encoding Categorical Data** lesson in General ML. This is the sklearn-specific quick reference.

## OneHotEncoder
For nominal (unordered) categories — creates a binary column per category.
\`\`\`python
from sklearn.preprocessing import OneHotEncoder
encoder = OneHotEncoder(handle_unknown="ignore", sparse_output=False)
X_encoded = encoder.fit_transform(X_train[["city"]])
\`\`\`

## OrdinalEncoder
For ordered categories — maps categories to integers in a specified order.
\`\`\`python
from sklearn.preprocessing import OrdinalEncoder
encoder = OrdinalEncoder(categories=[["low", "medium", "high"]])
X_encoded = encoder.fit_transform(X_train[["satisfaction"]])
\`\`\`

## Common Mistakes
> ❌ Not specifying \`handle_unknown="ignore"\` on OneHotEncoder — crashes on unseen categories at prediction time.
> ❌ Not specifying \`categories=\` explicitly on OrdinalEncoder — it defaults to alphabetical order, which is often not the intended rank.

## Quick Revision

related:['missing-values'],
body:`
## Quick Reference
For the full concept (MCAR/MAR/MNAR, when to flag vs. impute), see the **Missing Values** lesson in General ML. This is the sklearn-specific quick reference.

\`\`\`python
from sklearn.impute import SimpleImputer

# Numeric columns — median is robust to outliers
num_imputer = SimpleImputer(strategy="median")

# Categorical columns
cat_imputer = SimpleImputer(strategy="most_frequent")

X_train_imputed = num_imputer.fit_transform(X_train[numeric_cols])
X_test_imputed = num_imputer.transform(X_test[numeric_cols])   # transform only!
\`\`\`

## Important Parameters
- \`strategy\` — \`"mean"\`, \`"median"\` (numeric, outlier-robust), \`"most_frequent"\` (categorical or numeric), \`"constant"\` (with \`fill_value\`).

## Common Mistakes
> ❌ \`fit_transform\` on test data instead of \`transform\` — recomputes fill values from test data, leaking information.
> ❌ Using \`"mean"\` on heavily skewed numeric data — \`"median"\` is usually safer.

{id:'composition-tools', name:'Composition Tools', pyClass:'Pipeline / ColumnTransformer / FeatureUnion', family:'Composition', difficulty:'intermediate', days:[6],
blurb:'The sklearn tools for chaining and combining preprocessing steps — quick reference.',
related:['pipelines'],
body:`
## Quick Reference
For the full concept and worked example, see the **Pipelines** lesson in General ML. This page is a quick sklearn-specific reference for all three composition tools.

## Pipeline
Chains steps sequentially into one fit/predict object.
\`\`\`python
from sklearn.pipeline import Pipeline
pipe = Pipeline([("imputer", SimpleImputer()), ("scaler", StandardScaler()), ("model", LogisticRegression())])
\`\`\`

## ColumnTransformer
Applies different preprocessing branches to different columns, then combines the results.
\`\`\`python
from sklearn.compose import ColumnTransformer
preprocessor = ColumnTransformer([
    ("num", numeric_pipeline, numeric_cols),
    ("cat", categorical_pipeline, categorical_cols),
], remainder="drop")   # or "passthrough" to keep unlisted columns unchanged
\`\`\`

## FeatureUnion
Applies several transformers to the *same* input and concatenates their outputs side by side (as opposed to ColumnTransformer, which routes different columns to different branches).
\`\`\`python
from sklearn.pipeline import FeatureUnion
combined = FeatureUnion([("pca", PCA(n_components=5)), ("select", SelectKBest(k=5))])
\`\`\`

## Common Mistakes
> ❌ Confusing ColumnTransformer (splits columns across branches) with FeatureUnion (applies multiple transforms to the same columns and concatenates).
> ❌ Forgetting \`remainder="passthrough"\` when you want unlisted columns kept, not dropped.

## Quick Revision
See box below.

## Practice
Quiz below.
`,

body:`
## Quick Reference
The concepts behind these tools are covered in depth in General ML: **Train/Val/Test Split**, **Cross-Validation**, **GridSearchCV**, and **RandomizedSearchCV**. This page is a quick sklearn API reference covering the full toolkit, including a few tools not detailed elsewhere.

## Splitting
\`\`\`python
from sklearn.model_selection import train_test_split
X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.2, stratify=y, random_state=42)
\`\`\`

## Cross-validation iterators
\`\`\`python
from sklearn.model_selection import KFold, StratifiedKFold

kfold = KFold(n_splits=5, shuffle=True, random_state=42)               # regression / general use
skfold = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)     # classification — preserves class balance
\`\`\`

## cross_validate
Like \`cross_val_score\`, but returns multiple metrics and timing info at once.
\`\`\`python
from sklearn.model_selection import cross_validate
results = cross_validate(model, X_train, y_train, cv=5, scoring=["accuracy", "f1", "roc_auc"])
print(results["test_f1"].mean())
\`\`\`

## learning_curve
Shows how performance changes as training set size grows — helps diagnose whether more data would actually help.
\`\`\`python
from sklearn.model_selection import learning_curve
train_sizes, train_scores, val_scores = learning_curve(model, X_train, y_train, cv=5, train_sizes=[0.1,0.3,0.5,0.7,1.0])
\`\`\`
If train and validation scores are both low and close together, more data likely won't help much — the model itself needs to improve. If there's a large, persistent gap between them, more data (or more regularization) may help.

## validation_curve
Shows how performance changes as a single hyperparameter varies — useful for visually spotting the overfitting/underfitting trade-off point.
\`\`\`python
from sklearn.model_selection import validation_curve
train_scores, val_scores = validation_curve(model, X_train, y_train, param_name="max_depth", param_range=[2,4,6,8,10,None], cv=5)
\`\`\`

## Common Mistakes
> ❌ Using plain \`KFold\` (no stratification) on imbalanced classification data — use \`StratifiedKFold\`.
> ❌ Never running a \`learning_curve\` before deciding you need "more data" — it's a quick, direct way to check if that assumption is even true.

## Quick Revision
See box below.

## Practice
Quiz below.

## Quick Reference
For the concepts (which metric to choose, and why), see **Model Evaluation** and **Imbalanced Data** in General ML. This page maps out the actual function calls.

## Regression
\`\`\`python
from sklearn.metrics import mean_absolute_error, mean_squared_error, r2_score

mae = mean_absolute_error(y_test, y_pred)
rmse = mean_squared_error(y_test, y_pred, squared=False)   # or: mean_squared_error(...) ** 0.5
r2 = r2_score(y_test, y_pred)
\`\`\`

## Classification
\`\`\`python
from sklearn.metrics import (
    accuracy_score, precision_score, recall_score, f1_score,
    roc_auc_score, confusion_matrix, classification_report
)

acc = accuracy_score(y_test, y_pred)
f1 = f1_score(y_test, y_pred)                       # binary by default; use average="macro"/"weighted" for multiclass
auc = roc_auc_score(y_test, y_proba[:, 1])           # needs probabilities, not hard labels

\`\`\`

body:`
## What is it?
Both tools convert a collection of text documents into a numeric matrix, where each row is a document and each column is a word (or n-gram) — the standard "bag-of-words" representation.

## Intuition
A model can't read "free money now!!!" directly. Vectorization turns it into a row of numbers representing which words appeared (and how often/how distinctively), which a classifier can then learn patterns from.

## How it works
- **CountVectorizer** — each column is the raw count of how many times a word appears in that document.
- **TfidfVectorizer** — weights word counts by how distinctive they are: common words appearing in almost every document (like "the") get down-weighted, while words that are frequent in a specific document but rare overall get up-weighted. Usually outperforms raw counts for classification.

## When should I use it?
Any text classification task (spam detection, sentiment analysis) as the entry point of the pipeline, almost always followed by a linear model (Logistic Regression, LinearSVC) or Naive Bayes.

## When should I avoid it?
When word order and context matter deeply (bag-of-words ignores order entirely) — that's outside the scope of what sklearn's vectorizers can capture; you'd need embeddings/transformer models for that.

## Important Parameters
- \`max_features\` — cap the vocabulary size to the top N most frequent terms, controlling dimensionality.
- \`ngram_range\` — e.g. \`(1, 2)\` includes both single words and two-word phrases, capturing a little more context.
- \`stop_words="english"\` — automatically drops common, low-signal words like "the," "is," "and."
- \`min_df\` / \`max_df\` — drop terms that are too rare or too common to be useful.

## Training
\`\`\`python
from sklearn.feature_extraction.text import TfidfVectorizer
from sklearn.linear_model import LogisticRegression
from sklearn.pipeline import Pipeline

model = Pipeline([
    ("tfidf", TfidfVectorizer(max_features=20000, ngram_range=(1,2), stop_words="english")),
    ("clf", LogisticRegression(max_iter=1000)),
])
model.fit(X_train_text, y_train)
\`\`\`

## Prediction
\`\`\`python
predictions = model.predict(X_test_text)
probabilities = model.predict_proba(X_test_text)[:, 1]
\`\`\`

## Common Mistakes
> ❌ Fitting the vectorizer on the full dataset (train+test) — leaks test vocabulary/statistics into training, the text-data version of the same leakage issue everywhere else.
> ❌ Not capping \`max_features\` on a large corpus — vocabulary size can explode into hundreds of thousands of columns.

## Comparison
TF-IDF is almost always a stronger default than raw CountVectorizer for classification, since it naturally downweights uninformative common words. Pair the resulting sparse matrix with \`TruncatedSVD\` if you need dimensionality reduction downstream.

/* ---------------------------------------------------------
   Tiny inline markdown -> HTML renderer (no deps)
--------------------------------------------------------- */
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function inlineMd(text){
  let t = escapeHtml(text);
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return t;
}
function highlightPy(code){
  let c = escapeHtml(code);
  c = c.replace(/(#.*)$/gm, '<span class="tok-com">$1</span>');
  c = c.replace(/("""[\s\S]*?"""|'''[\s\S]*?''')/g, '<span class="tok-str">$1</span>');
  c = c.replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g, '<span class="tok-str">$1</span>');
  c = c.replace(/\b(import|from|as|def|class|return|if|elif|else|for|while|in|not|and|or|is|None|True|False|try|except|with|lambda|print)\b/g, '<span class="tok-kw">$1</span>');
  c = c.replace(/\b([A-Za-z_][A-Za-z0-9_]*)(?=\()/g, '<span class="tok-fn">$1</span>');
  c = c.replace(/\b(\d+\.?\d*)\b/g, '<span class="tok-num">$1</span>');
  return c;
}
function mdToHtml(md){
  const lines = md.replace(/\r\n/g,'\n').split('\n');
  let html = '';
  let i = 0;
  let paraBuf = [];
  let listBuf = [];
  let listType = null;
  let quoteBuf = [];

  function flushPara(){
    if(paraBuf.length){
      html += '<p>' + inlineMd(paraBuf.join(' ')) + '</p>';
      paraBuf = [];
    }
  }
  function flushList(){
    if(listBuf.length){
      const tag = listType === 'ol' ? 'ol' : 'ul';
      html += '<' + tag + '>' + listBuf.map(li => '<li>' + inlineMd(li) + '</li>').join('') + '</' + tag + '>';
      listBuf = [];
      listType = null;
    }
  }
  function flushQuote(){
    if(quoteBuf.length){
      const joined = quoteBuf.join(' ');
      const isExample = /^>\s*[""]|real|Example|example/.test(joined) === false; // heuristic unused
      const cls = quoteBuf[0].trim().startsWith('✅') || quoteBuf[0].trim().startsWith('>') && quoteBuf.join(' ').includes('👉') ? 'example' : '';
      html += '<div class="callout">' + inlineMd(joined) + '</div>';
      quoteBuf = [];
    }
  }

  while(i < lines.length){
    let line = lines[i];

    // code fence
    if(line.trim().startsWith('```')){
      flushPara(); flushList(); flushQuote();
      const lang = line.trim().slice(3).trim();
      let codeLines = [];
      i++;
      while(i < lines.length && !lines[i].trim().startsWith('```')){
        codeLines.push(lines[i]);
        i++;
      }
      const codeText = codeLines.join('\n');
      const highlighted = lang === 'python' ? highlightPy(codeText) : escapeHtml(codeText);
      html += '<pre><code>' + highlighted + '</code></pre>';
      i++;
      continue;
    }

    if(line.trim().startsWith('## ')){
      flushPara(); flushList(); flushQuote();
      const raw = line.trim().slice(3).trim();
      const m = raw.match(/^(\d+)\.\s*(.*)$/);
      if(m){
        html += '<h2><span class="num">' + m[1] + '</span>' + inlineMd(m[2]) + '</h2>';
      } else {
        html += '<h2>' + inlineMd(raw) + '</h2>';
      }
      i++;
      continue;
    }
    if(line.trim().startsWith('### ')){
      flushPara(); flushList(); flushQuote();
      html += '<h3>' + inlineMd(line.trim().slice(4).trim()) + '</h3>';
      i++;
      continue;
    }
    if(line.trim().startsWith('> ')){
      flushPara(); flushList();
      quoteBuf.push(line.trim().slice(2));
      i++;
      continue;
    } else if(quoteBuf.length){
      flushQuote();
    }
    if(/^-\s+/.test(line.trim())){
      flushPara();
      if(listType && listType !== 'ul'){ flushList(); }
      listType = 'ul';
      listBuf.push(line.trim().replace(/^-\s+/, ''));
      i++;
      continue;
    }
    if(/^\d+\.\s+/.test(line.trim())){
      flushPara();
      if(listType && listType !== 'ol'){ flushList(); }
      listType = 'ol';
      listBuf.push(line.trim().replace(/^\d+\.\s+/, ''));
      i++;
      continue;
    } else if(listBuf.length){
      flushList();
    }
    if(line.trim() === ''){
      flushPara();
      i++;
      continue;
    }
    paraBuf.push(line.trim());
    i++;
  }
  flushPara(); flushList(); flushQuote();
  return html;
}

/* ---------------------------------------------------------
   Persistent progress via window.storage (personal, per-user)
--------------------------------------------------------- */
const STORAGE_KEY = 'recall-progress-v1';
let progressData = {};      // { lessonId: 'completed' | 'in-progress' }
let progressLoaded = false;

async function loadProgress(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){ progressData = JSON.parse(res.value); }
  }catch(e){ progressData = {}; }
  progressLoaded = true;
  renderApp();
}
async function saveProgress(){
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify(progressData), false); }
  catch(e){ /* ignore — non-fatal */ }
}
function setLessonStatus(id, status){
  if(status === 'not-started'){ delete progressData[id]; }
  else { progressData[id] = status; }
  saveProgress();
  renderApp();
}
function getLessonStatus(id){
  return progressData[id] || 'not-started';
}
function computeGroupProgress(ids){
  if(!ids.length) return 0;
  const done = ids.filter(id => progressData[id] === 'completed').length;
  return Math.round((done / ids.length) * 100);
}

    '<div class="pick-card-top"><h4>' + title + '</h4>' + difficultyPill(l.difficulty) + '</div>' +
    '<p>' + (l.blurb || '') + '</p></div>';
}

  html += '</div>';
  html += '</div>';

  html += '<div class="section-title">Continue where you left off <span class="n">'+(inProgressIds.length?'in progress':'suggested starting point')+'</span></div>';

function quickRow(k,v){
  return '<div class="quick-row"><div class="quick-key">'+k+'</div><div class="quick-val">'+v+'</div></div>';
}

/* ---------------------------------------------------------
   Lesson page
--------------------------------------------------------- */
function findPrevNext(id){
  // Build a flat ordered list: general lessons in curriculum order, then sklearn algos in day/nav order
  const flatIds = [];
  ALL_GENERAL.forEach(l => flatIds.push(l.id));
  const seen = new Set();
  SKLEARN_DAYS.forEach(d => d.groups.forEach(g => g.items.forEach(it => {
    if(it.type !== 'general' && !seen.has(it.id)){ seen.add(it.id); flatIds.push(it.id); }
  })));
  const idx = flatIds.indexOf(id);
  return {
    prev: idx > 0 ? flatIds[idx-1] : null,
    next: idx >= 0 && idx < flatIds.length-1 ? flatIds[idx+1] : null,
  };
}

function renderQuizBlock(quiz, lessonId){
  if(!quiz || !quiz.length) return '';
  let html = '';
  quiz.forEach((q, qi) => {
    html += '<div class="quiz-card" data-quiz-card="'+lessonId+':'+qi+'">';
    html += '<div class="quiz-q">Q'+(qi+1)+'. ' + inlineMd(q.q) + '</div>';
    html += '<div class="quiz-options">';
    q.options.forEach((opt, oi) => {
      const letter = String.fromCharCode(65+oi);
      html += '<div class="quiz-opt" data-quiz-opt data-lesson="'+lessonId+'" data-qi="'+qi+'" data-oi="'+oi+'">';
      html += '<span class="letter">'+letter+'</span><span>'+inlineMd(opt)+'</span>';
      html += '</div>';
    });
    html += '</div>';
    html += '<div class="quiz-explain-slot"></div>';
    html += '</div>';
  });
  return html;
}

function renderLesson(){
  const l = LESSON_BY_ID[state.currentId];
  if(!l) { return renderHome(); }
  const isAlgo = l.kind === 'algo';
  const title = l.title || l.name;
  const status = getLessonStatus(l.id);
  const {prev, next} = findPrevNext(l.id);

  let html = '<div class="content-wrap">';

  html += '<div class="lesson-head">';
  html += '<div class="lesson-meta-row">' + difficultyPill(l.difficulty);
  if(isAlgo){ html += '<span class="pill" style="background:var(--violet-soft);color:var(--violet)">'+ (l.family||'') +'</span>'; }
  if(isAlgo && l.pyClass){ html += '<code style="font-size:11.5px">'+escapeHtml(l.pyClass)+'</code>'; }
  html += '</div>';
  html += '<h1 class="lesson-title">' + title + '</h1>';
  html += '<p class="lesson-desc">' + (l.blurb||'') + '</p>';
  html += '<div class="mark-complete-row">';
  html += '<button class="btn ' + (status==='completed'?'done':'') + '" data-set-status="'+l.id+'" data-status-val="completed">' +
    (status==='completed' ? '✓ Completed' : 'Mark as Complete') + '</button>';
  if(status !== 'in-progress' && status !== 'completed'){
    html += '<button class="btn" data-set-status="'+l.id+'" data-status-val="in-progress">Mark In Progress</button>';
  }
  if(status !== 'not-started'){
    html += '<button class="btn" data-set-status="'+l.id+'" data-status-val="not-started">Reset</button>';
  }
  html += '</div>';
  html += '</div>';

  html += '<div class="tabs">';
  html += '<div class="tab '+(state.activeTab==='learn'?'active':'')+'" data-tab="learn">Learn</div>';
  html += '<div class="tab '+(state.activeTab==='revision'?'active':'')+'" data-tab="revision">Quick Revision</div>';
  html += '<div class="tab '+(state.activeTab==='quiz'?'active':'')+'" data-tab="quiz">Practice ('+(l.quiz?l.quiz.length:0)+')</div>';
  html += '</div>';

  if(state.activeTab === 'learn'){
    html += '<div class="lesson-body">' + mdToHtml(l.body || '') + '</div>';
  } else if(state.activeTab === 'revision'){
    html += renderRevisionBox(l);
  } else if(state.activeTab === 'quiz'){
    html += renderQuizBlock(l.quiz, l.id);
  }

  // related topics
  if(l.related && l.related.length){
    html += '<div class="related-box"><h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);font-family:var(--font-mono)">Related Topics</h3>';
    html += '<div class="related-tags">';
    l.related.forEach(rid => {
      const rl = LESSON_BY_ID[rid];
      if(rl) html += '<span class="related-tag" data-nav="'+rid+'">→ ' + (rl.title||rl.name) + '</span>';
    });
    html += '</div></div>';
  }

  // prev/next
  html += '<div class="lesson-footer-nav">';
  if(prev){
    const pl = LESSON_BY_ID[prev];
    html += '<div class="footer-nav-btn" data-nav="'+prev+'"><div class="lbl">← Previous</div><div class="ttl">'+(pl.title||pl.name)+'</div></div>';
  } else { html += '<div></div>'; }
  if(next){
    const nl = LESSON_BY_ID[next];
    html += '<div class="footer-nav-btn right" data-nav="'+next+'"><div class="lbl">Next →</div><div class="ttl">'+(nl.title||nl.name)+'</div></div>';
  }
  html += '</div>';

  html += '</div>';
  return html;
}

function revRow(key, val){
  return '<div class="quick-row"><div class="quick-key">'+key+'</div><div class="quick-val">'+inlineMd(val)+'</div></div>';
}
function revRowRaw(key, html){
  return '<div class="quick-row"><div class="quick-key">'+key+'</div><div class="quick-val">'+html+'</div></div>';
}
function renderRevisionBox(l){
  const qr = l.quickRevision;
  if(!qr) return '<p style="color:var(--text-faint)">No quick revision available.</p>';
  let html = '<div style="margin:8px 0 28px">';
  html += '<div class="rev-badge">⚡ 2-5 minute refresh</div>';
  html += '<div class="quick-grid">';
  html += revRow('What it is', qr.what);
  html += revRow('Why we use it', qr.why);
  html += revRow('When to use it', qr.when);
  html += revRow('When NOT to use it', qr.whenNot);
  if(qr.params) html += revRow('Important params', qr.params);
  html += revRowRaw('Key code', '<code>'+escapeHtml(qr.code)+'</code>');
  html += revRow('Common mistakes', qr.mistakes);
  html += '</div>';
  html += '<div class="callout example" style="margin-top:14px"><b>Key takeaway —</b> ' + inlineMd(qr.key) + '</div>';
  html += '</div>';
  return html;
}

/* ---------------------------------------------------------
   Search
--------------------------------------------------------- */
function searchLessons(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  const all = [...ALL_GENERAL.map(l=>({...l,kind:'general'})), ...ALL_ALGOS.map(l=>({...l,kind:'algo'}))];
  return all.filter(l => {
    const title = (l.title||l.name||'').toLowerCase();
    const blurb = (l.blurb||'').toLowerCase();
    const pyClass = (l.pyClass||'').toLowerCase();
    const body = (l.body||'').toLowerCase();
    return title.includes(q) || blurb.includes(q) || pyClass.includes(q) || body.includes(q);
  }).slice(0, 30).sort((a,b) => {
    const at = (a.title||a.name||'').toLowerCase(), bt = (b.title||b.name||'').toLowerCase();
    const aStarts = at.startsWith(q) ? 0 : 1;
    const bStarts = bt.startsWith(q) ? 0 : 1;
    return aStarts - bStarts;
  });
}
function renderSearchOverlay(){
  if(!state.searchOpen) return '';
  const results = searchLessons(state.searchQuery);
  let html = '<div class="search-overlay" data-search-close>';
  html += '<div class="search-modal">';
  html += '<input id="search-input" autofocus placeholder="Search lessons, algorithms, params..." value="'+escapeHtml(state.searchQuery)+'" />';
  html += '<div class="search-results">';
  if(state.searchQuery.trim() === ''){
    html += '<div style="padding:24px 16px;color:var(--text-faint);font-size:13px">Try "random forest", "scaling", "overfitting", "cross validation"...</div>';
  } else if(results.length === 0){
    html += '<div style="padding:24px 16px;color:var(--text-faint);font-size:13px">No lessons found for "'+escapeHtml(state.searchQuery)+'"</div>';
  } else {
    results.forEach(r => {
      const kindLabel = r.kind === 'algo' ? (r.family||'Algorithm') : 'General ML';
      html += '<div class="search-result" data-nav="'+r.id+'" data-search-nav>';
      html += '<div style="flex:1"><div class="sr-title">'+(r.title||r.name)+'</div><div class="sr-sub">'+kindLabel+'</div></div>';
      html += '</div>';
    });
  }
  html += '</div></div></div>';
  return html;
}

/* ---------------------------------------------------------
   Main render + mount
--------------------------------------------------------- */
function renderApp(){
  const root = document.getElementById('root');
  let html = '<div class="app-shell">';
  html += '<div class="sidebar '+(state.sidebarOpen?'open':'')+'">' + renderSidebar() + '</div>';
  html += '<div class="main">';
  html += renderTopbar();
  html += (state.view === 'lesson' && state.currentId) ? renderLesson() : renderHome();
  html += '</div>';
  html += '</div>';
  html += renderSearchOverlay();
  root.innerHTML = html;

  // Re-focus search input if open, preserve cursor position at end
  if(state.searchOpen){
    const input = document.getElementById('search-input');
    if(input){
      input.focus();
      const val = input.value; input.value=''; input.value = val;
    }
  }
  // Re-render answered quiz states (persisted per-session in quizAnswers)
  Object.keys(quizAnswers).forEach(key => {
    const [lessonId, qi] = key.split(':');
    applyQuizVisual(lessonId, qi, quizAnswers[key]);
  });
}

/* ---------------------------------------------------------
   Quiz answer tracking (session-only, resets on reload)
--------------------------------------------------------- */
const quizAnswers = {}; // key: "lessonId:qi" -> selectedOptionIndex

function applyQuizVisual(lessonId, qi, selectedIdx){
  const card = document.querySelector('[data-quiz-card="'+lessonId+':'+qi+'"]');
  if(!card) return;
  const lesson = LESSON_BY_ID[lessonId];
  const q = lesson.quiz[qi];
  const opts = card.querySelectorAll('.quiz-opt');
  opts.forEach((el, oi) => {
    el.classList.add('disabled');
    if(oi === q.answer) el.classList.add('correct');
    else if(oi === selectedIdx) el.classList.add('wrong');
  });
  const slot = card.querySelector('.quiz-explain-slot');
  if(slot && !slot.innerHTML){
    slot.innerHTML = '<div class="quiz-explain">' +
      (selectedIdx === q.answer ? '✅ Correct. ' : '❌ Not quite. ') +
      inlineMd(q.explain) + '</div>';
  }
}

/* ---------------------------------------------------------
   Event delegation
--------------------------------------------------------- */
document.addEventListener('click', (e) => {
  const navEl = e.target.closest('[data-nav]');
  const themeEl = e.target.closest('[data-theme-toggle]');
  const menuEl = e.target.closest('[data-menu-toggle]');
  const toggleEl = e.target.closest('[data-toggle]');
  const toggleDayEl = e.target.closest('[data-toggle-day]');
  const toggleGroupEl = e.target.closest('[data-toggle-group]');
  const tabEl = e.target.closest('[data-tab]');
  const statusEl = e.target.closest('[data-set-status]');
  const quizOptEl = e.target.closest('[data-quiz-opt]');
  const homeEl = e.target.closest('[data-nav-home]');
  const searchOpenEl = e.target.closest('[data-search-open]');

  // Nav clicks take priority (covers sidebar items, cards, search results, related tags, prev/next)
  if(navEl){
    e.preventDefault();
    const id = navEl.getAttribute('data-nav');
    if(id && LESSON_BY_ID[id]){
      state.searchOpen = false;
      navigate(id);
    }
    return;
  }
  if(quizOptEl){
    const lessonId = quizOptEl.getAttribute('data-lesson');
    const qi = quizOptEl.getAttribute('data-qi');
    const oi = parseInt(quizOptEl.getAttribute('data-oi'), 10);
    const key = lessonId+':'+qi;
    if(quizAnswers[key] === undefined){
      quizAnswers[key] = oi;
      applyQuizVisual(lessonId, qi, oi);
    }
    return;
  }
  if(statusEl){
    e.preventDefault();
    setLessonStatus(statusEl.getAttribute('data-set-status'), statusEl.getAttribute('data-status-val'));
    return;
  }
  if(tabEl){
    state.activeTab = tabEl.getAttribute('data-tab');
    renderApp();
    return;
  }
  if(homeEl){ goHome(); return; }
  if(searchOpenEl){
    state.searchOpen = true;
    state.searchQuery = '';
    renderApp();
    return;
  }
  if(themeEl){
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.classList.toggle('light', state.theme === 'light');
    renderApp();
    return;
  }
  if(menuEl){
    state.sidebarOpen = !state.sidebarOpen;
    renderApp();
    return;
  }
  if(toggleEl){
    const key = toggleEl.getAttribute('data-toggle');
    if(key === 'sklearn') state.navSklearnOpen = !state.navSklearnOpen;
    if(key === 'general') state.navGeneralOpen = !state.navGeneralOpen;
    renderApp();
    return;
  }
  if(toggleDayEl){
    const day = toggleDayEl.getAttribute('data-toggle-day');
    state.openDays[day] = !state.openDays[day];
    renderApp();
    return;
  }
  if(toggleGroupEl){
    const key = toggleGroupEl.getAttribute('data-toggle-group');
    state.openGroups[key] = state.openGroups[key] === false ? true : false;
    renderApp();
    return;
  }
  // Click landed on the overlay backdrop itself (not any interactive child) — close search
  if(e.target.classList && e.target.classList.contains('search-overlay')){
    state.searchOpen = false;
    renderApp();
    return;
  }
});

document.addEventListener('input', (e) => {
  if(e.target.id === 'search-input'){
    state.searchQuery = e.target.value;
    renderApp();
  }
});

document.addEventListener('keydown', (e) => {
  if(e.key === '/' && !state.searchOpen && document.activeElement.tagName !== 'INPUT'){
    e.preventDefault();
    state.searchOpen = true;
    state.searchQuery = '';
    renderApp();
  } else if(e.key === 'Escape' && state.searchOpen){
    state.searchOpen = false;
    renderApp();
  }
});

/* ---------------------------------------------------------
   Init
--------------------------------------------------------- */
parseHash();
renderApp();
loadProgress();

</script>
