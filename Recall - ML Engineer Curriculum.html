{id:'linear-regression', name:'Linear Regression', pyClass:'LinearRegression', family:'Regression', difficulty:'beginner', days:[1],
blurb:'The simplest, most interpretable model for predicting a continuous number — always your first baseline.',
related:['ridge','lasso','feature-scaling'],
body:`
## What is Linear Regression?
It finds the straight-line (or hyperplane, with multiple features) relationship between your features and a continuous target, by minimizing the sum of squared errors between predictions and actual values.

## Intuition
Imagine plotting square footage against house price. Linear Regression draws the single straight line that sits as close as possible to every point on average. Each feature gets a weight (coefficient) telling you how much the prediction moves when that feature increases by one unit, holding everything else constant.

## How it works
It solves for the coefficients that minimize **Mean Squared Error** — either via a closed-form matrix solution (Ordinary Least Squares) or gradient descent for very large datasets. No iterative "learning rate" tuning needed for the standard sklearn implementation — it solves directly.

## When should I use it?
- You need an interpretable model where you can explain *why* a prediction was made.
- The relationship between features and target is roughly linear.
- You want a fast, no-tuning-required baseline before trying anything fancier.

## When should I avoid it?
- The true relationship is strongly non-linear (consider trees/ensembles, or engineer polynomial features).
- You have many highly correlated features (multicollinearity destabilizes coefficients — consider Ridge instead).
- Outliers are common (squared error punishes them heavily — consider a robust alternative).

## Important Parameters
- \`fit_intercept\` (default True) — whether to fit the bias term. Almost always leave as True.
- \`n_jobs\` — parallelism for large datasets. Rarely matters for LinearRegression itself.

Linear Regression has almost no hyperparameters to tune — that's part of its appeal as a baseline.

## Practical Example
Predicting house price from square footage, bedrooms, and neighborhood (one-hot encoded).

## Training
\`\`\`python
from sklearn.linear_model import LinearRegression
from sklearn.pipeline import Pipeline
from sklearn.preprocessing import StandardScaler

model = Pipeline([("scaler", StandardScaler()), ("lr", LinearRegression())])
model.fit(X_train, y_train)
\`\`\`

## Prediction
\`\`\`python
predictions = model.predict(X_test)
\`\`\`

## Evaluation
\`\`\`python
from sklearn.metrics import mean_absolute_error, r2_score
print("MAE:", mean_absolute_error(y_test, predictions))
print("R2:", r2_score(y_test, predictions))
\`\`\`

## Hyperparameter Tuning
There's little to tune on plain LinearRegression — if it underperforms, the fix is usually feature engineering (transformations, interactions) or switching to Ridge/Lasso for regularization, not hyperparameter search.

## Common Mistakes
> ❌ Not scaling features when interpreting coefficient magnitude as "importance" — unscaled coefficients aren't comparable across features with different ranges.
> ❌ Trusting it blindly on strongly non-linear data without checking residual plots first.
> ❌ Ignoring multicollinearity — check a correlation matrix or VIF before trusting individual coefficients.

## Algorithm Comparison
Prefer **Ridge** when you have many correlated features and want stability. Prefer **Lasso** when you suspect many features are irrelevant and want automatic feature selection. Prefer a **tree-based model** when the relationship is clearly non-linear.

## Quick Revision
See the box below.

## Practice

body:`
## What is Ridge?
Linear Regression with an added penalty on the size of the coefficients (L2 regularization) — it shrinks coefficients toward zero without ever making them exactly zero, trading a small amount of bias for a meaningful reduction in variance.

## Intuition
Plain Linear Regression can produce huge, unstable coefficients when features are correlated (multicollinearity) — small data changes swing the coefficients wildly. Ridge discourages any single coefficient from growing too large, producing a more stable, generalizable model.

## How it works
It minimizes squared error **plus** \`alpha * sum(coefficients^2)\`. Larger \`alpha\` means stronger shrinkage toward zero.

## When should I use it?
Many correlated numeric features; you want a stable, generalizing linear model without discarding any features.

## When should I avoid it?
You actually want automatic feature selection (some coefficients driven to exactly zero) — use Lasso instead.

## Important Parameters
- \`alpha\` (default 1.0) — regularization strength. Higher = more shrinkage, simpler model, potentially more bias. Tune via cross-validation.
- \`solver\` — usually leave on \`"auto"\`.

## Practical Example
Predicting salary from a wide set of correlated features (years of experience, age, tenure, education level).

## Training
\`\`\`python
from sklearn.linear_model import Ridge
model = Ridge(alpha=1.0)
model.fit(X_train, y_train)
\`\`\`

## Prediction
\`\`\`python
predictions = model.predict(X_test)
\`\`\`

## Evaluation
Same regression metrics as Linear Regression: MAE, RMSE, R².

## Hyperparameter Tuning
\`\`\`python
from sklearn.linear_model import RidgeCV
model = RidgeCV(alphas=[0.01, 0.1, 1.0, 10.0, 100.0], cv=5).fit(X_train, y_train)
print(model.alpha_)
\`\`\`
\`RidgeCV\` efficiently searches alpha values using built-in cross-validation, faster than manually wrapping in GridSearchCV.

## Common Mistakes
> ❌ Not scaling features before Ridge — the regularization penalty is scale-sensitive, so unscaled features get unevenly penalized.
> ❌ Leaving alpha at the default without ever tuning it.

## Algorithm Comparison
Ridge keeps all features (shrinks, never zeroes). Lasso can zero out features entirely (built-in feature selection). ElasticNet blends both behaviors.

## Quick Revision
See box below.

body:`
## What is Lasso?
Linear Regression with an L1 penalty on coefficient magnitude — unlike Ridge, this penalty can shrink coefficients all the way to exactly zero, effectively performing automatic feature selection.

## Intuition
If you suspect many of your features are irrelevant noise, Lasso will "turn them off" by setting their coefficients to zero, leaving you with a simpler, more interpretable model that only uses the features that mattered.

## How it works
Minimizes squared error plus \`alpha * sum(|coefficients|)\`. The absolute-value penalty (unlike Ridge's squared penalty) is what allows exact zeros.

## When should I use it?
High-dimensional data where you suspect many features are irrelevant, and you want built-in feature selection alongside prediction.

## When should I avoid it?
Features are all likely relevant and correlated with each other — Lasso tends to arbitrarily pick one from a correlated group and zero out the rest, which can feel unstable. ElasticNet often handles this better.

## Important Parameters
- \`alpha\` — regularization strength, same role as Ridge. Higher = more coefficients zeroed out.

## Practical Example
A dataset with 200 engineered features where you suspect only ~20 are genuinely predictive.

## Training
\`\`\`python
from sklearn.linear_model import Lasso
model = Lasso(alpha=0.1)
model.fit(X_train, y_train)
print((model.coef_ != 0).sum(), "features kept out of", X_train.shape[1])
\`\`\`

## Prediction
\`\`\`python
predictions = model.predict(X_test)
\`\`\`

## Evaluation
Standard regression metrics (MAE, RMSE, R²).

## Hyperparameter Tuning
\`\`\`python
from sklearn.linear_model import LassoCV
model = LassoCV(cv=5, random_state=42).fit(X_train, y_train)
\`\`\`

## Common Mistakes
> ❌ Not scaling features first — same as Ridge, the penalty is scale-sensitive.
> ❌ Setting alpha too high and zeroing out genuinely useful features — always check how many features survive.

## Algorithm Comparison
Lasso for automatic feature selection with sparse solutions. Ridge for stability with correlated features, keeping everything. ElasticNet as a middle ground.

{id:'elasticnet', name:'ElasticNet', pyClass:'ElasticNet', family:'Regression', difficulty:'intermediate', days:[1],
blurb:'A blend of Ridge and Lasso — gets some feature selection while staying more stable with correlated features.',
related:['ridge','lasso'],
body:`
## What is ElasticNet?
A linear model combining both L1 (Lasso-style) and L2 (Ridge-style) penalties, controlled by a mixing ratio — giving you some automatic feature selection while retaining more of Ridge's stability with correlated features.

## Intuition
Lasso can behave erratically when features are highly correlated (arbitrarily picking one and dropping the rest). ElasticNet softens this by blending in Ridge's tendency to shrink correlated features together rather than picking a winner randomly.

## How it works
Penalty = \`alpha * (l1_ratio * |coef| + (1 - l1_ratio) * coef^2)\`. \`l1_ratio=1\` is pure Lasso, \`l1_ratio=0\` is pure Ridge.

## When should I use it?
Many correlated features AND you still want some automatic feature elimination — a common real-world combination.

## When should I avoid it?
If you clearly only need one behavior (pure stability → Ridge, pure sparsity → Lasso), a simpler model is easier to reason about.

## Important Parameters
- \`alpha\` — overall regularization strength.
- \`l1_ratio\` — mixing ratio between L1 and L2 (0 to 1).

## Training
\`\`\`python
from sklearn.linear_model import ElasticNet
model = ElasticNet(alpha=0.1, l1_ratio=0.5)
model.fit(X_train, y_train)
\`\`\`

## Prediction
\`\`\`python
predictions = model.predict(X_test)
\`\`\`

## Hyperparameter Tuning
\`\`\`python
from sklearn.linear_model import ElasticNetCV
model = ElasticNetCV(l1_ratio=[.1, .5, .7, .9, .99, 1], cv=5).fit(X_train, y_train)
\`\`\`

## Common Mistakes
> ❌ Leaving \`l1_ratio\` at a default guess instead of tuning it — it materially changes model behavior.

## Algorithm Comparison
The middle ground between Ridge and Lasso — worth trying whenever you're unsure which of the two fits better.

body:`
## What is Logistic Regression?
Despite the name, it's a classification algorithm. It models the probability that an input belongs to a class using a linear combination of features passed through a sigmoid function, squashing the output into a 0-1 probability.

## Intuition
It draws a linear decision boundary between classes, but instead of a hard yes/no, it gives you a smooth probability — "78% chance this is spam" — which you can threshold however your use case needs.

## How it works
Learns coefficients that maximize the likelihood of the observed labels. The sigmoid function converts a linear score into a probability; a threshold (default 0.5) converts that probability into a class label.

## When should I use it?
Binary or multi-class classification with a roughly linear decision boundary, when you need interpretable coefficients or calibrated probabilities, and as your default first classification baseline.

## When should I avoid it?
The decision boundary is clearly non-linear and you have no polynomial/interaction features to help it — a tree-based model will likely do better with less feature engineering effort.

## Important Parameters
- \`C\` (default 1.0) — inverse of regularization strength. Lower C = stronger regularization = simpler model.
- \`penalty\` — \`"l2"\` (default), \`"l1"\` (sparse), or \`"elasticnet"\`.
- \`class_weight\` — set to \`"balanced"\` for imbalanced classes.
- \`max_iter\` — increase if you get a convergence warning (default 100 is sometimes too low).

## Practical Example
Predicting customer churn (yes/no) from tenure, usage, and support ticket count.

## Training
\`\`\`python
from sklearn.linear_model import LogisticRegression
model = LogisticRegression(class_weight="balanced", max_iter=1000)
model.fit(X_train, y_train)
\`\`\`

## Prediction
\`\`\`python
predictions = model.predict(X_test)
probabilities = model.predict_proba(X_test)[:, 1]
\`\`\`

## Evaluation
\`\`\`python
from sklearn.metrics import classification_report, roc_auc_score
print(classification_report(y_test, predictions))
print("ROC-AUC:", roc_auc_score(y_test, probabilities))
\`\`\`

## Hyperparameter Tuning
\`\`\`python
from sklearn.model_selection import GridSearchCV
search = GridSearchCV(LogisticRegression(max_iter=1000), {"C": [0.01, 0.1, 1, 10]}, cv=5, scoring="f1")
search.fit(X_train, y_train)
\`\`\`

## Common Mistakes
> ❌ Not scaling features — the regularization penalty (and convergence speed) is sensitive to feature scale.
> ❌ Interpreting accuracy alone on imbalanced classes; use \`class_weight="balanced"\` and check F1/recall.
> ❌ Ignoring convergence warnings — usually fixed by scaling features or raising \`max_iter\`.

## Algorithm Comparison
Faster and more interpretable than SVM/tree ensembles on roughly linear problems. Random Forest/Gradient Boosting usually win on strongly non-linear, tabular problems at the cost of interpretability.

## Quick Revision
See box below.

## Practice

{id:'knn', name:'K-Nearest Neighbors', pyClass:'KNeighborsClassifier / KNeighborsRegressor', family:'Classification & Regression', difficulty:'beginner', days:[1,2,3],
blurb:'Predicts based on the K closest training examples — no real "training" step, just memorization plus distance lookup.',
related:['feature-scaling','svm','pca'],
body:`
## What is KNN?
A simple, non-parametric algorithm: to classify (or predict a value for) a new point, it finds the K closest points in the training data (by distance) and lets them vote (classification) or averages them (regression).

## Intuition
"You are the average of your K nearest neighbors." If most of a new customer's 5 closest look-alikes churned, predict churn.

## How it works
1. Compute the distance (usually Euclidean) from the new point to every training point.
2. Take the K closest.
3. Classification: majority vote among their labels. Regression: average of their target values.

There's no real training phase — KNN just stores the data and does the work at prediction time, which makes prediction relatively slow on large datasets.

## When should I use it?
Small-to-medium datasets, low-to-moderate dimensionality, when the decision boundary is irregular/non-linear and you don't want to assume a functional form.

## When should I avoid it?
Large datasets (prediction gets slow — it must compare against every training point), high-dimensional data (the "curse of dimensionality" makes distance less meaningful), or when features aren't scaled.

## Important Parameters
- \`n_neighbors\` (default 5) — the K. Smaller K = more sensitive to noise (overfitting); larger K = smoother, more biased boundary.
- \`weights\` — \`"uniform"\` (equal vote) or \`"distance"\` (closer neighbors count more).
- \`metric\` — usually \`"minkowski"\`/Euclidean; can be changed for special data types.

## Practical Example
Classifying handwritten digits using pixel intensity features, or predicting a house's price from its K most similar (by features) neighboring sales.

## Training
\`\`\`python
from sklearn.neighbors import KNeighborsClassifier
from sklearn.pipeline import Pipeline
from sklearn.preprocessing import StandardScaler

model = Pipeline([("scaler", StandardScaler()), ("knn", KNeighborsClassifier(n_neighbors=5))])
model.fit(X_train, y_train)   # essentially just stores the data
\`\`\`

## Prediction
\`\`\`python
predictions = model.predict(X_test)
\`\`\`

## Evaluation
Standard classification metrics (accuracy, F1, ROC-AUC) or regression metrics (MAE, R²) depending on the task.

## Hyperparameter Tuning
\`\`\`python
from sklearn.model_selection import GridSearchCV
search = GridSearchCV(model, {"knn__n_neighbors": [3, 5, 7, 11, 15]}, cv=5, scoring="f1")
search.fit(X_train, y_train)
\`\`\`

## Common Mistakes
> ❌ Skipping feature scaling — distance-based, so an unscaled large-range feature dominates everything.
> ❌ Using a very small K (like 1) — extremely sensitive to noise and outliers.
> ❌ Using KNN on very high-dimensional or very large data without reconsidering — it degrades on both fronts.

## Algorithm Comparison
Simpler and more intuitive than SVM, but scales worse to large datasets. Trees handle high dimensionality and mixed feature types more gracefully.

## Quick Revision
See box below.

## Practice
Quiz below.

body:`
## What is a Decision Tree?
A model that repeatedly splits the data on the feature/threshold that best separates the target, building a tree of yes/no questions until it reaches a prediction at each leaf.

## Intuition
"Is income > $50k? If yes, is age > 30? ..." — a series of simple questions that eventually funnel any input to a final prediction. You can literally draw it and read it top to bottom.

## How it works
At each node, the tree tries every feature and threshold, picking the split that most reduces impurity (Gini or entropy for classification, variance reduction for regression). It repeats recursively until a stopping condition (max depth, min samples, or pure leaves) is reached.

## When should I use it?
You need a fully interpretable, visualizable model; features are a mix of numeric and categorical; you don't want to worry about scaling.

## When should I avoid it?
On its own, a single deep tree overfits very easily — in practice, you almost always want an ensemble of trees (Random Forest, Gradient Boosting) rather than one tree alone, unless interpretability of a single flowchart is the explicit goal.

## Important Parameters
- \`max_depth\` — caps tree depth. The single most important lever against overfitting.
- \`min_samples_split\` / \`min_samples_leaf\` — minimum samples required to split/to form a leaf. Higher values = simpler, less overfit tree.
- \`criterion\` — \`"gini"\` or \`"entropy"\` for classification; \`"squared_error"\` for regression.

## Practical Example
A single interpretable tree explaining loan approval decisions to a compliance team.

## Training
\`\`\`python
from sklearn.tree import DecisionTreeClassifier
model = DecisionTreeClassifier(max_depth=5, min_samples_leaf=10, random_state=42)
model.fit(X_train, y_train)
\`\`\`

## Prediction
\`\`\`python
predictions = model.predict(X_test)
\`\`\`

## Evaluation
Standard classification/regression metrics depending on task.

## Hyperparameter Tuning
\`\`\`python
from sklearn.model_selection import GridSearchCV
search = GridSearchCV(DecisionTreeClassifier(random_state=42),
                       {"max_depth": [3,5,7,10,None], "min_samples_leaf": [1,5,10,20]}, cv=5, scoring="f1")
search.fit(X_train, y_train)
\`\`\`

## Common Mistakes
> ❌ Leaving \`max_depth=None\` (unlimited) — a single unconstrained tree will nearly always overfit training data badly.
> ❌ Using a single tree in production instead of an ensemble when raw accuracy (not visual interpretability) is the goal.

## Algorithm Comparison
A single tree is easy to read but weak and unstable (small data changes can produce a very different tree). Random Forest and Gradient Boosting combine many trees to fix exactly this weakness, at the cost of losing single-flowchart interpretability.

{id:'random-forest', name:'Random Forest', pyClass:'RandomForestClassifier / RandomForestRegressor', family:'Ensemble (Bagging)', difficulty:'intermediate', days:[1,2,4],
blurb:'An ensemble of many decision trees, each trained on a random subset — the reliable go-to for tabular data.',
related:['decision-tree','extra-trees','bagging','gradient-boosting'],
body:`
## What is Random Forest?
An ensemble of many Decision Trees, each trained on a random bootstrap sample of the data and a random subset of features at each split, with predictions combined by majority vote (classification) or averaging (regression).

## Intuition
One tree is unstable and overfits. Hundreds of trees, each seeing a slightly different random slice of the data and features, make different mistakes — averaging them out cancels much of the noise while keeping the signal, producing a far more robust model than any single tree.

## How it works
1. Draw N bootstrap samples (random sampling with replacement) from the training data.
2. Train a separate Decision Tree on each sample, considering only a random subset of features at each split.
3. Combine all tree predictions by vote (classification) or average (regression).

## When should I use it?
Tabular data with mixed feature types, as a strong, low-effort baseline that rarely needs much tuning, when you want solid accuracy without heavy hyperparameter search.

## When should I avoid it?
You need maximum interpretability (individual trees are readable, but a forest of hundreds isn't), or extremely high-dimensional sparse data (like raw text), where linear models often do better.

## Important Parameters
- \`n_estimators\` (default 100) — number of trees. More is generally better (with diminishing returns), at the cost of training/prediction time.
- \`max_depth\` — usually left as \`None\` (trees grow fully) since averaging over many trees controls overfitting; can be capped for speed or extra regularization.
- \`min_samples_leaf\` — increases robustness by preventing tiny, noise-driven leaves.
- \`max_features\` — number of features considered at each split (default \`"sqrt"\` for classification). Lower values increase tree diversity.

## Practical Example
Predicting customer churn from a mix of usage stats, demographics, and support history — Random Forest handles the mixed feature types with zero scaling required.

## Training
\`\`\`python
from sklearn.ensemble import RandomForestClassifier
model = RandomForestClassifier(n_estimators=300, min_samples_leaf=2, random_state=42, n_jobs=-1)
model.fit(X_train, y_train)
\`\`\`

## Prediction
\`\`\`python
predictions = model.predict(X_test)
probabilities = model.predict_proba(X_test)
\`\`\`

## Evaluation
Standard classification/regression metrics, plus \`.feature_importances_\` for a quick (if imperfect) look at what mattered.

## Hyperparameter Tuning
\`\`\`python
from sklearn.model_selection import RandomizedSearchCV
from scipy.stats import randint
param_dist = {"n_estimators": randint(200, 800), "max_depth": [None, 10, 20, 30], "min_samples_leaf": randint(1, 10)}
search = RandomizedSearchCV(RandomForestClassifier(random_state=42), param_dist, n_iter=30, cv=5, scoring="f1", n_jobs=-1)
search.fit(X_train, y_train)
\`\`\`

## Common Mistakes
> ❌ Assuming it needs feature scaling — it doesn't (it's tree-based).
> ❌ Trusting \`.feature_importances_\` blindly for high-cardinality features — prefer permutation importance for a trustworthy read.
> ❌ Using very few trees (\`n_estimators\` too low) — you lose the averaging benefit that makes the ensemble stable.

## Algorithm Comparison
Generally more robust and easier to tune well "out of the box" than Gradient Boosting, though Gradient Boosting can often squeeze out slightly higher accuracy with careful tuning. Faster to train in parallel than boosting (trees are independent, boosting trees are sequential).

## What is Extra Trees?
"Extremely Randomized Trees" — very similar to Random Forest, but instead of searching for the *best* split threshold for each candidate feature, it picks split thresholds **randomly** and chooses the best among those random options.

## Intuition
Random Forest already adds randomness through bootstrap sampling and random feature subsets. Extra Trees goes one step further by also randomizing the split thresholds themselves — trading a bit of per-tree accuracy for even lower variance and noticeably faster training.

## How it works
Same ensemble structure as Random Forest, but: (1) it typically uses the whole training set per tree rather than a bootstrap sample, and (2) split points are chosen randomly rather than optimally, then the best random split is kept.

## When should I use it?
Similar situations to Random Forest — when you want a fast, robust tabular baseline, especially when training speed matters or when Random Forest is overfitting slightly.

## When should I avoid it?
When you specifically need the absolute best possible split quality on smaller datasets — the extra randomness can occasionally cost a bit of accuracy versus Random Forest.

## Important Parameters
Same core set as Random Forest: \`n_estimators\`, \`max_depth\`, \`min_samples_leaf\`, \`max_features\`.

## Training
\`\`\`python
from sklearn.ensemble import ExtraTreesClassifier
model = ExtraTreesClassifier(n_estimators=300, random_state=42, n_jobs=-1)
model.fit(X_train, y_train)
\`\`\`

## Prediction
\`\`\`python
predictions = model.predict(X_test)
\`\`\`

## Evaluation
Same as Random Forest — classification/regression metrics plus feature importances.

## Hyperparameter Tuning
Same approach as Random Forest — \`RandomizedSearchCV\` over \`n_estimators\`, \`max_depth\`, \`min_samples_leaf\`.

## Common Mistakes
> ❌ Assuming it's strictly better than Random Forest — always compare both via cross-validation on your specific dataset rather than assuming.

## Algorithm Comparison
Generally trains faster than Random Forest and can generalize slightly better on noisy data, at the cost of occasionally slightly worse fit on cleaner, smaller datasets. Worth trying both and comparing via CV.

{id:'svm', name:'Support Vector Machine', pyClass:'SVC / SVR / LinearSVC / LinearSVR', family:'Classification & Regression', difficulty:'intermediate', days:[2,3],
blurb:'Finds the boundary that maximizes the margin between classes — powerful on small, high-dimensional data.',
related:['knn','logistic-regression','one-class-svm'],
body:`
## What is SVM?
A model that finds the decision boundary (hyperplane) that maximizes the margin — the distance — between the closest points of each class (the "support vectors"). With a kernel, it can find non-linear boundaries by implicitly mapping data into a higher-dimensional space.

## Intuition
Instead of just finding *a* line that separates classes, SVM finds the line that separates them with the widest possible cushion on both sides — this tends to generalize better than an arbitrary separating line.

## How it works
For linear problems, \`LinearSVC\`/\`LinearSVR\` fit a linear boundary efficiently. For non-linear boundaries, \`SVC\`/\`SVR\` use the **kernel trick** (commonly RBF) to implicitly project data into higher dimensions where a linear separator does exist, without ever computing that projection explicitly.

## When should I use it?
Small-to-medium datasets, especially with more features than samples (e.g. text/genomics), when you need a strong non-linear boundary without much feature engineering.

## When should I avoid it?
Large datasets — training time scales poorly (quadratic-ish) with the number of rows for the kernel versions. Use \`LinearSVC\`/\`LinearSVR\` for large, linearly-separable-ish data instead.

## Important Parameters
- \`C\` — regularization strength (inverse). Lower C = wider margin, more tolerance for misclassified points (simpler model). Higher C = fits training data more tightly.
- \`kernel\` — \`"linear"\`, \`"rbf"\` (default, good general non-linear choice), \`"poly"\`.
- \`gamma\` — for RBF kernel, controls how far the influence of a single point reaches. Low gamma = smoother boundary; high gamma = tighter, more complex boundary (overfitting risk).

## Practical Example
Cancer diagnosis from a moderate number of biopsy-derived numeric features — SVM with an RBF kernel is a classic strong choice here.

## Training
\`\`\`python
from sklearn.svm import SVC
from sklearn.pipeline import Pipeline
from sklearn.preprocessing import StandardScaler

model = Pipeline([("scaler", StandardScaler()), ("svc", SVC(kernel="rbf", C=1.0, gamma="scale", probability=True))])
model.fit(X_train, y_train)
\`\`\`

## Prediction
\`\`\`python
predictions = model.predict(X_test)
\`\`\`

## Evaluation
Standard classification/regression metrics.

## Hyperparameter Tuning
\`\`\`python
from sklearn.model_selection import GridSearchCV
param_grid = {"svc__C": [0.1, 1, 10], "svc__gamma": ["scale", 0.01, 0.1, 1]}
search = GridSearchCV(model, param_grid, cv=5, scoring="f1")
search.fit(X_train, y_train)
\`\`\`
C and gamma should always be tuned together — they interact strongly.

## Common Mistakes
> ❌ Skipping feature scaling — SVM is heavily distance-based, just like KNN.
> ❌ Using the RBF kernel on very large datasets and being surprised training is slow.
> ❌ Tuning C or gamma independently instead of jointly (grid search over both together).

## Algorithm Comparison
Often stronger than Logistic Regression on non-linear boundaries in small-to-medium data, but slower to train on large datasets and less interpretable. Tree ensembles usually win on large tabular datasets with less tuning effort.

{id:'naive-bayes', name:'Naive Bayes', pyClass:'GaussianNB / MultinomialNB / BernoulliNB', family:'Classification', difficulty:'beginner', days:[2],
blurb:'A fast, probabilistic classifier built on a strong (and usually wrong, but useful) independence assumption.',
related:['logistic-regression','text-vectorization'],
body:`
## What is Naive Bayes?
A family of classifiers based on Bayes' Theorem, with the simplifying ("naive") assumption that all features are independent of each other given the class. Despite that assumption rarely being true, it works remarkably well in practice, especially for text.

## Intuition
To classify an email as spam, it estimates: given the words in this email, which class (spam / not spam) makes those words most probable, treating each word's presence as independent evidence. It's naive because word occurrences obviously aren't truly independent — but it's fast and surprisingly effective anyway.

## How it works
Computes \`P(class | features)\` via Bayes' theorem, using \`P(features | class)\` estimated from training data (assuming feature independence) and the class prior \`P(class)\`. It then picks the class with the highest resulting probability.

## When should I use it?
Text classification (spam detection, sentiment) — its natural home. Also useful as an extremely fast baseline for any classification problem, especially with limited training data.

## When should I avoid it?
Features are strongly correlated and that correlation actually carries signal — the independence assumption will hurt more here. Also weaker on purely numeric, non-text tabular data compared to tree ensembles.

## Important Parameters
- **GaussianNB** — for continuous numeric features, assumes each feature is normally distributed within each class. Few parameters to tune.
- **MultinomialNB** — for count-based features (word counts, TF-IDF); has an \`alpha\` smoothing parameter to avoid zero probabilities for unseen words.
- **BernoulliNB** — for binary/boolean features (word present or not).

## Practical Example
Spam detection: convert email text to word counts (\`CountVectorizer\`) or TF-IDF, then classify with \`MultinomialNB\`.

## Training
\`\`\`python
from sklearn.feature_extraction.text import TfidfVectorizer
from sklearn.naive_bayes import MultinomialNB
from sklearn.pipeline import Pipeline

model = Pipeline([("tfidf", TfidfVectorizer()), ("nb", MultinomialNB(alpha=1.0))])
model.fit(X_train_text, y_train)
\`\`\`

## Prediction
\`\`\`python
predictions = model.predict(X_test_text)
probabilities = model.predict_proba(X_test_text)
\`\`\`

## Evaluation
Standard classification metrics — precision/recall are especially important for spam-style problems.

## Hyperparameter Tuning
\`\`\`python
from sklearn.model_selection import GridSearchCV
search = GridSearchCV(model, {"nb__alpha": [0.01, 0.1, 0.5, 1.0, 2.0]}, cv=5, scoring="f1")
search.fit(X_train_text, y_train)
\`\`\`

## Common Mistakes
> ❌ Using GaussianNB on count/text data (or MultinomialNB on continuous data) — match the variant to your feature type.
> ❌ Forgetting the \`alpha\` smoothing parameter on MultinomialNB — without it, any word unseen during training gives a zero probability and can break predictions.

## Algorithm Comparison
Much faster to train than Logistic Regression or SVM on large text datasets, and a very strong first baseline for text classification specifically. Usually outperformed by Logistic Regression or Linear SVC once you have enough labeled data, since Naive Bayes's independence assumption becomes more of a bottleneck.

## Quick Revision

{id:'gradient-boosting', name:'Gradient Boosting', pyClass:'GradientBoostingClassifier / GradientBoostingRegressor', family:'Ensemble (Boosting)', difficulty:'intermediate', days:[1,2,4],
blurb:'Builds trees sequentially, each one correcting the errors of the ones before it — often the strongest tabular model.',
related:['hist-gradient-boosting','random-forest','adaboost'],
body:`
## What is Gradient Boosting?
An ensemble that builds trees **sequentially**, where each new tree is trained specifically to correct the errors (residuals) of the combined ensemble so far, rather than being trained independently like Random Forest.

## Intuition
Tree 1 makes predictions with some errors. Tree 2 is trained specifically to predict those errors. Tree 3 corrects what's still wrong after tree 1 + tree 2. Repeat — each tree is a small, deliberate correction, gradually driving the overall error down.

## How it works
Bagging (Random Forest, Bagging, ...
    ↓
Parallel models
    ↓
Reduce variance

Boosting
    ↓
Sequential models
    ↓
Fix previous errors

Each new tree fits the negative gradient of the loss function with respect to the current predictions — hence "Gradient" Boosting.

## When should I use it?
Tabular data where you want the strongest possible predictive accuracy and are willing to invest in careful tuning — frequently the top performer in tabular ML competitions.

## When should I avoid it?
Very large datasets where training speed matters (consider HistGradientBoosting instead — much faster). Also easier to overfit than Random Forest if left untuned, so it needs more careful hyperparameter attention.

## Important Parameters
- \`n_estimators\` — number of sequential trees. More trees + lower learning rate is a common effective combo.
- \`learning_rate\` — how much each tree corrects the ensemble. Lower = more conservative, needs more trees, often generalizes better.
- \`max_depth\` — individual trees are usually kept shallow (3-6) since boosting compounds many weak trees rather than needing each one to be strong alone.

## Practical Example
Customer churn prediction where squeezing out the last few points of F1/ROC-AUC has real business value.

## Training
\`\`\`python
from sklearn.ensemble import GradientBoostingClassifier
model = GradientBoostingClassifier(n_estimators=300, learning_rate=0.05, max_depth=3, random_state=42)
model.fit(X_train, y_train)
\`\`\`

## Prediction
\`\`\`python
predictions = model.predict(X_test)
\`\`\`

## Evaluation
Standard classification/regression metrics.

## Hyperparameter Tuning
\`\`\`python
from sklearn.model_selection import RandomizedSearchCV
from scipy.stats import randint, uniform
param_dist = {"n_estimators": randint(100, 600), "learning_rate": uniform(0.01, 0.2), "max_depth": randint(2, 6)}
search = RandomizedSearchCV(GradientBoostingClassifier(random_state=42), param_dist, n_iter=40, cv=5, scoring="f1")
search.fit(X_train, y_train)
\`\`\`
\`n_estimators\` and \`learning_rate\` trade off directly — more trees at a lower learning rate is usually a safer combination than fewer trees at a high learning rate.

## Common Mistakes
> ❌ Leaving \`n_estimators\` very high with a high \`learning_rate\` — a fast recipe for overfitting.
> ❌ Not comparing against HistGradientBoosting on larger datasets, where it's often both faster and comparably accurate.

## Algorithm Comparison
Usually edges out Random Forest slightly on accuracy with careful tuning, but is more overfitting-prone and slower to train (sequential, can't fully parallelize across trees). HistGradientBoosting offers most of the same power with much better speed on large datasets.

## Quick Revision
See box below.

## Practice

{id:'hist-gradient-boosting', name:'HistGradientBoosting', pyClass:'HistGradientBoostingClassifier / Regressor', family:'Ensemble (Boosting)', difficulty:'intermediate', days:[1,2,4],
blurb:'A much faster Gradient Boosting implementation using histogram binning — sklearn\'s answer to XGBoost/LightGBM.',
related:['gradient-boosting','random-forest'],
body:`
## What is HistGradientBoosting?
A modern, much faster implementation of Gradient Boosting that bins continuous features into discrete histograms before finding splits, dramatically speeding up training on large datasets — inspired by (and competitive with) libraries like LightGBM.

## Intuition
Standard Gradient Boosting checks every possible split threshold for every feature at every node — expensive at scale. HistGradientBoosting instead groups feature values into a fixed number of bins (e.g. 255) first, then only considers splits between bins — far fewer candidates to evaluate, with minimal accuracy loss.

## How it works
Same sequential, error-correcting boosting process as standard Gradient Boosting, but the split-finding step operates on binned histograms instead of raw sorted values — this is what makes it so much faster on large datasets, and it also natively handles missing values without imputation.

## When should I use it?
Any dataset large enough that standard \`GradientBoostingClassifier\`/\`Regressor\` feels slow (tens of thousands of rows or more) — this should usually be your default boosting choice today.

## When should I avoid it?
Very small datasets where the speed advantage doesn't matter and you want the simpler, more thoroughly battle-tested standard implementation.

## Important Parameters
- \`max_iter\` — equivalent to \`n_estimators\` in standard Gradient Boosting.
- \`learning_rate\` — same role as standard Gradient Boosting.
- \`max_depth\` / \`max_leaf_nodes\` — controls individual tree complexity.
- Natively supports \`NaN\` values in features — no imputation required for missing numeric data.

## Practical Example
A large-scale fraud detection dataset with millions of rows, where standard Gradient Boosting would be impractically slow to train.

## Training
\`\`\`python
from sklearn.ensemble import HistGradientBoostingClassifier
model = HistGradientBoostingClassifier(max_iter=300, learning_rate=0.05, random_state=42)
model.fit(X_train, y_train)   # handles NaN in X_train natively
\`\`\`

## Prediction
\`\`\`python
predictions = model.predict(X_test)
\`\`\`

## Evaluation
Standard classification/regression metrics.

## Hyperparameter Tuning
Same style as Gradient Boosting: tune \`max_iter\`, \`learning_rate\`, and \`max_depth\`/\`max_leaf_nodes\` together via \`RandomizedSearchCV\`.

## Common Mistakes
> ❌ Manually imputing missing values before using it — it handles \`NaN\` natively, so this step is often unnecessary (though sometimes still worth doing deliberately for other reasons).
> ❌ Defaulting to plain \`GradientBoostingClassifier\` out of habit on large datasets without trying this faster alternative first.

## Algorithm Comparison
Comparable accuracy to standard Gradient Boosting in most cases, but dramatically faster on large datasets — there's rarely a strong reason to prefer the standard implementation once your dataset is non-trivial in size.

## Quick Revision
See box below.

## Practice
Quiz below.

{id:'adaboost', name:'AdaBoost', pyClass:'AdaBoostClassifier / AdaBoostRegressor', family:'Ensemble (Boosting)', difficulty:'intermediate', days:[4],
blurb:'The original boosting algorithm — reweights misclassified examples so the next learner focuses on them.',
related:['gradient-boosting','decision-tree'],
body:`
## What is AdaBoost?
"Adaptive Boosting" — an ensemble that trains a sequence of weak learners (typically shallow decision trees, "stumps"), where each new learner focuses more on the examples the previous ones got wrong, by increasing their sample weight.

## Intuition
After each round, misclassified points get "louder" (higher weight) so the next weak learner is forced to pay more attention to them. The final prediction is a weighted vote of all the weak learners, with more accurate learners getting more say.

## How it works
1. Start with equal weights on all training examples.
2. Train a weak learner; compute its weighted error.
3. Increase the weight of misclassified examples; decrease weight of correctly classified ones.
4. Repeat, then combine all learners' predictions weighted by their individual accuracy.

## When should I use it?
Simpler, moderate-sized datasets where you want a boosting-style model with fewer hyperparameters to tune than Gradient Boosting.

## When should I avoid it?
Noisy data with mislabeled examples — AdaBoost can over-focus on noisy/mislabeled points since it keeps upweighting whatever it gets wrong, including genuine label errors. Gradient Boosting or HistGradientBoosting are usually stronger and more robust choices today.

## Important Parameters
- \`n_estimators\` — number of weak learners in the sequence.
- \`learning_rate\` — shrinks the contribution of each learner, similar role to Gradient Boosting's.
- \`estimator\` — the weak learner type, commonly a shallow \`DecisionTreeClassifier(max_depth=1)\`.

## Training
\`\`\`python
from sklearn.ensemble import AdaBoostClassifier
model = AdaBoostClassifier(n_estimators=200, learning_rate=0.5, random_state=42)
model.fit(X_train, y_train)
\`\`\`

## Prediction
\`\`\`python
predictions = model.predict(X_test)
\`\`\`

## Hyperparameter Tuning
Tune \`n_estimators\` and \`learning_rate\` jointly via \`GridSearchCV\`/\`RandomizedSearchCV\`.

## Common Mistakes
> ❌ Using it on data with significant label noise — it will chase the noisy examples aggressively.
> ❌ Assuming it's a strict upgrade over Gradient Boosting — in most modern benchmarks, GB/HistGB tend to outperform it.

## Algorithm Comparison
Historically important as the original practical boosting algorithm; largely superseded in accuracy by Gradient Boosting and HistGradientBoosting on most tabular problems today, though still simple and fast for smaller, cleaner datasets.

## Quick Revision
See box below.

## Practice

{id:'bagging', name:'Bagging', pyClass:'BaggingClassifier / BaggingRegressor', family:'Ensemble (Bagging)', difficulty:'intermediate', days:[4],
blurb:'The general recipe behind Random Forest — train many copies of any model on random data subsets and average.',
related:['random-forest','extra-trees'],
body:`
## What is Bagging?
"Bootstrap Aggregating" — the general ensemble technique of training many independent copies of a base model, each on a random bootstrap sample of the training data, and combining their predictions by voting or averaging. Random Forest is Bagging specifically applied to Decision Trees (with an added layer of feature randomness).

## Intuition
Any model that tends to overfit (high variance) benefits from bagging — training many slightly-different versions on different random slices of data and averaging smooths out the overfitting of any individual model.

## How it works
1. Draw N bootstrap samples from the training set (sampling with replacement).
2. Train an independent copy of the base estimator on each sample.
3. Combine predictions: majority vote (classification) or average (regression).

## When should I use it?
When you have a base model that overfits easily (like an unconstrained Decision Tree) and want a general-purpose way to stabilize it — useful when you want bagging behavior with a base estimator other than a tree (Random Forest is the tree-specific, more optimized special case).

## When should I avoid it?
For trees specifically, \`RandomForestClassifier\`/\`Regressor\` is usually a better default — it adds feature-level randomness on top of bagging, typically outperforming plain \`BaggingClassifier\` with a tree base estimator.

## Important Parameters
- \`estimator\` — the base model to bag (any sklearn estimator).
- \`n_estimators\` — number of bagged copies.
- \`max_samples\` / \`max_features\` — fraction of data/features each copy sees.

## Training
\`\`\`python
from sklearn.ensemble import BaggingClassifier
from sklearn.tree import DecisionTreeClassifier

model = BaggingClassifier(estimator=DecisionTreeClassifier(), n_estimators=200, random_state=42, n_jobs=-1)
model.fit(X_train, y_train)
\`\`\`

## Prediction
\`\`\`python
predictions = model.predict(X_test)
\`\`\`

## Common Mistakes
> ❌ Using \`BaggingClassifier\` with a Decision Tree base estimator when \`RandomForestClassifier\` (which adds feature randomness too) would typically do better with less tuning.
> ❌ Bagging a low-variance model (like Linear Regression) — bagging mainly helps high-variance models; there's little benefit for models that don't overfit much on their own.

## Algorithm Comparison
Random Forest is essentially a specialized, more powerful version of Bagging for trees. Plain Bagging is more useful when you want the technique applied to a non-tree base estimator.

## Quick Revision
See box below.

## Practice

{id:'voting', name:'Voting Ensemble', pyClass:'VotingClassifier / VotingRegressor', family:'Ensemble (Meta)', difficulty:'intermediate', days:[4],
blurb:'Combines predictions from several different model types by simple vote or average.',
related:['stacking','random-forest','gradient-boosting'],
body:`
## What is a Voting Ensemble?
A meta-model that combines the predictions of several different, already-trained model types (e.g. Logistic Regression + Random Forest + SVM) by majority vote (classification) or averaging (regression) — no additional training beyond fitting the base models.

## Intuition
Different model families make different kinds of mistakes. If Logistic Regression, Random Forest, and Gradient Boosting each get some rows wrong independently, combining their votes can cancel out some of those individual mistakes.

## How it works
- **Hard voting** — each model casts one vote for a class; majority wins.
- **Soft voting** — average the predicted probabilities across models, then pick the highest; usually performs better if the base models produce well-calibrated probabilities.

## When should I use it?
You already have a few genuinely different, reasonably strong models and want a quick, simple way to combine them for a small accuracy boost, without the complexity of stacking.

## When should I avoid it?
Your candidate models are very similar to each other (e.g. several tree ensembles) — voting benefits most from genuinely diverse model types. If the base models make correlated mistakes, voting won't help much.

## Important Parameters
- \`estimators\` — list of (name, model) tuples.
- \`voting\` — \`"hard"\` or \`"soft"\`.
- \`weights\` — optional per-model weighting if some models should count more.

## Training
\`\`\`python
from sklearn.ensemble import VotingClassifier
from sklearn.linear_model import LogisticRegression
from sklearn.ensemble import RandomForestClassifier
from sklearn.svm import SVC

model = VotingClassifier(estimators=[
    ("lr", LogisticRegression(max_iter=1000)),
    ("rf", RandomForestClassifier(n_estimators=200, random_state=42)),
    ("svc", SVC(probability=True)),
], voting="soft")
model.fit(X_train, y_train)
\`\`\`

## Common Mistakes
> ❌ Combining models that are all essentially the same type — limited diversity means limited benefit.
> ❌ Using \`voting="hard"\` when your models already output good probability estimates — soft voting usually performs at least as well.

## Algorithm Comparison
Simpler than Stacking (no meta-learner to train), often a solid quick win. Stacking usually squeezes out a bit more performance by learning *how* to combine the base models rather than just averaging them.

## Quick Revision
See box below.

## Practice

{id:'stacking', name:'Stacking', pyClass:'StackingClassifier / StackingRegressor', family:'Ensemble (Meta)', difficulty:'advanced', days:[4],
blurb:'Trains a meta-model to learn the best way to combine several base models\' predictions.',
related:['voting','gradient-boosting'],
body:`
## What is Stacking?
An ensemble technique where several base models' predictions become the **input features** to a final "meta-model," which learns how to best combine them — rather than a fixed rule like averaging or voting.

## Intuition
Instead of assuming all base models deserve equal weight (like Voting), Stacking lets a simple model (often Logistic/Linear Regression) learn from data which base models to trust more, and in what combinations, potentially even learning that "when model A and B disagree, trust B."

## How it works
1. Train several diverse base models on the training data (via cross-validation, to avoid leakage).
2. Use their out-of-fold predictions as new features.
3. Train a meta-model (\`final_estimator\`) on those predictions to produce the final output.

## When should I use it?
You want to squeeze out extra performance from an ensemble of genuinely diverse models and have the computational budget to train and cross-validate multiple models plus a meta-learner.

## When should I avoid it?
Small datasets (the internal cross-validation splits get very small), tight compute/time budgets, or when interpretability matters — stacking is one of the least interpretable approaches here.

## Important Parameters
- \`estimators\` — list of base (name, model) tuples.
- \`final_estimator\` — the meta-model (default: Logistic/Ridge Regression, a sensible simple choice).
- \`cv\` — controls how out-of-fold predictions are generated for training the meta-model (critical to avoid leakage).

## Training
\`\`\`python
from sklearn.ensemble import StackingClassifier
from sklearn.linear_model import LogisticRegression
from sklearn.ensemble import RandomForestClassifier, GradientBoostingClassifier

model = StackingClassifier(
    estimators=[("rf", RandomForestClassifier(random_state=42)), ("gb", GradientBoostingClassifier(random_state=42))],
    final_estimator=LogisticRegression(),
    cv=5,
)
model.fit(X_train, y_train)
\`\`\`

## Common Mistakes
> ❌ Using a very complex meta-model — a simple linear meta-model is usually sufficient and less prone to overfitting the combination step itself.
> ❌ Skipping proper cross-validation internally — sklearn's \`StackingClassifier\` handles this correctly by default via the \`cv\` parameter, but a hand-rolled stacking implementation can easily leak.

## Algorithm Comparison
Usually the strongest (and most complex/slowest) of the three ensemble-combination approaches here (Voting, Bagging, Stacking) — worth it mainly when the last few points of accuracy genuinely matter and interpretability doesn't.

{id:'kmeans', name:'K-Means', pyClass:'KMeans / MiniBatchKMeans', family:'Clustering', difficulty:'beginner', days:[5],
blurb:'Groups data into K clusters by repeatedly assigning points to the nearest center and updating centers.',
related:['dbscan','agglomerative-clustering','pca'],
body:`
## What is K-Means?
An unsupervised algorithm that partitions data into K clusters, where each point belongs to the cluster with the nearest mean (centroid), iteratively refining the cluster centers until they stabilize.

## Intuition
Guess K center points, assign every data point to its nearest center, move each center to the average of its assigned points, and repeat — the centers "settle" into the natural centers of the data's groups.

## How it works
1. Initialize K centroids (sklearn uses smart \`"k-means++"\` initialization by default, spreading initial centroids apart for better convergence).
2. Assign every point to its nearest centroid.
3. Recompute each centroid as the mean of its assigned points.
4. Repeat steps 2-3 until assignments stop changing (or max iterations reached).

## When should I use it?
You have a rough idea of how many groups (K) should exist, clusters are roughly spherical/similar-sized, and you want a fast, simple, well-understood clustering baseline. \`MiniBatchKMeans\` is the go-to variant for very large datasets, trading a bit of accuracy for large speed gains.

## When should I avoid it?
Clusters have very different sizes/densities or non-spherical (e.g. crescent) shapes — K-Means assumes roughly round, similarly-sized clusters and will distort anything that doesn't fit that shape. Also requires choosing K in advance.

## Important Parameters
- \`n_clusters\` — the K. The single most important choice — see "Cluster Evaluation" methods (Silhouette Score, elbow method) to help pick it.
- \`init\` — \`"k-means++"\` (default, smart initialization) vs \`"random"\`.
- \`n_init\` — number of different centroid initializations tried; sklearn keeps the best result, since K-Means can converge to a locally-optimal (suboptimal) solution.

## Practical Example
Customer segmentation: cluster customers by spending patterns, order frequency, and average order value into groups like "high-value," "occasional," "at-risk."

## Training
\`\`\`python
from sklearn.cluster import KMeans
from sklearn.preprocessing import StandardScaler
from sklearn.pipeline import Pipeline

model = Pipeline([("scaler", StandardScaler()), ("kmeans", KMeans(n_clusters=4, n_init=10, random_state=42))])
model.fit(X)
labels = model.predict(X)   # cluster assignment for each row
\`\`\`

## Evaluation
\`\`\`python
from sklearn.metrics import silhouette_score
print(silhouette_score(X_scaled, labels))   # higher (closer to 1) = better-separated clusters
\`\`\`

## Hyperparameter Tuning ("choosing K")
\`\`\`python
inertias = []
for k in range(2, 10):
    km = KMeans(n_clusters=k, n_init=10, random_state=42).fit(X_scaled)
    inertias.append(km.inertia_)
# Plot k vs inertia — look for the "elbow" where adding more clusters stops helping much
\`\`\`

## Common Mistakes
> ❌ Not scaling features first — K-Means is distance-based, exactly like KNN and SVM.
> ❌ Picking K arbitrarily without checking the elbow method or silhouette score.
> ❌ Applying K-Means to non-spherical or very unevenly-sized clusters and being confused by poor results — check DBSCAN instead in that case.

## Comparison
DBSCAN doesn't require specifying K and handles irregular shapes/noise, but struggles with clusters of very different densities. Agglomerative Clustering gives you a full hierarchy to explore at different granularities. K-Means is the fastest and simplest starting point.

## Quick Revision
See box below.

## Practice

{id:'dbscan', name:'DBSCAN', pyClass:'DBSCAN', family:'Clustering', difficulty:'intermediate', days:[5],
blurb:'Finds clusters of arbitrary shape based on density, and naturally flags outliers as noise.',
related:['kmeans','isolation-forest'],
body:`
## What is DBSCAN?
"Density-Based Spatial Clustering" — groups together points that are closely packed (many nearby neighbors), marking points in low-density regions as noise/outliers. Unlike K-Means, it does not require specifying the number of clusters in advance.

## Intuition
A cluster is a dense "blob" of points where you can hop from neighbor to neighbor without ever having to jump far. Points that don't belong to any dense blob are simply labeled as noise, rather than being forced into the nearest cluster.

## How it works
For each point, DBSCAN counts how many other points fall within a radius \`eps\`. If that count meets \`min_samples\`, the point is a "core point" and starts (or joins) a cluster; the cluster grows by including all density-reachable neighbors. Points that don't qualify as core or reachable are labeled \`-1\` (noise).

## When should I use it?
You don't know how many clusters to expect, clusters have irregular (non-spherical) shapes, and you want built-in outlier/noise detection as part of clustering.

## When should I avoid it?
Clusters have very different densities — a single \`eps\` value can't fit both dense and sparse clusters well simultaneously. Also sensitive to the scale of features, like any distance-based method.

## Important Parameters
- \`eps\` — the neighborhood radius. Too small = everything becomes noise; too large = clusters merge together. Usually the most important, trickiest parameter to tune.
- \`min_samples\` — minimum neighbors within \`eps\` to be a core point. Higher values require denser regions to form a cluster.

## Practical Example
Finding geographic hotspots of activity (e.g. delivery request clusters in a city) where the number of hotspots isn't known in advance and isolated requests should be flagged as noise, not forced into a cluster.

## Training
\`\`\`python
from sklearn.cluster import DBSCAN
from sklearn.preprocessing import StandardScaler

X_scaled = StandardScaler().fit_transform(X)
model = DBSCAN(eps=0.5, min_samples=5)
labels = model.fit_predict(X_scaled)   # -1 means "noise"
print("Clusters found:", len(set(labels)) - (1 if -1 in labels else 0))
\`\`\`

## Evaluation
\`\`\`python
from sklearn.metrics import silhouette_score
mask = labels != -1   # silhouette score is undefined for noise points
print(silhouette_score(X_scaled[mask], labels[mask]))
\`\`\`

## Hyperparameter Tuning
A common heuristic for \`eps\`: plot the distance to each point's k-th nearest neighbor sorted in increasing order, and look for the "knee" in the curve — that distance is a reasonable starting \`eps\`.

## Common Mistakes
> ❌ Not scaling features — the \`eps\` radius is meaningless if features are on wildly different scales.
> ❌ Picking \`eps\` by trial-and-error without the k-distance plot heuristic.
> ❌ Applying DBSCAN to data with clusters of very different densities and being confused by poor results.

## Comparison
Unlike K-Means, no need to specify the cluster count and it naturally handles noise/outliers and irregular shapes. But it's more sensitive to parameter choice (\`eps\`) and struggles when clusters have very different densities.

## Quick Revision
See box below.

## Practice

{id:'agglomerative-clustering', name:'Agglomerative Clustering', pyClass:'AgglomerativeClustering', family:'Clustering', difficulty:'intermediate', days:[5],
blurb:'Builds a hierarchy of clusters bottom-up, merging the closest pairs step by step.',
related:['kmeans','dbscan'],
body:`
## What is Agglomerative Clustering?
A hierarchical clustering method that starts with every point as its own cluster, then repeatedly merges the two closest clusters, building up a tree (dendrogram) of nested groupings until everything is in one cluster.

## Intuition
Instead of committing to a fixed K upfront, you build the entire merge history — you can then "cut" the resulting tree at any level to get however many clusters makes sense, exploring different granularities from the same computation.

## How it works
1. Start with each point as its own cluster.
2. Find the two closest clusters (by a chosen linkage method) and merge them.
3. Repeat until one cluster remains, recording the merge order/distances.
4. Cut the resulting dendrogram at the desired number of clusters or distance threshold.

## When should I use it?
You want to explore the data at multiple levels of granularity, want a visual dendrogram to help decide on the number of clusters, or have a domain reason to expect nested/hierarchical groupings.

## When should I avoid it?
Very large datasets — the naive algorithm is computationally expensive (roughly quadratic or worse in the number of points), making it impractical much beyond tens of thousands of rows.

## Important Parameters
- \`n_clusters\` — number of clusters to cut the tree into (or \`None\` with \`distance_threshold\` set instead).
- \`linkage\` — how distance between clusters is measured: \`"ward"\` (minimizes variance within clusters, a common good default), \`"complete"\`, \`"average"\`, \`"single"\`.

## Training
\`\`\`python
from sklearn.cluster import AgglomerativeClustering
from sklearn.preprocessing import StandardScaler

X_scaled = StandardScaler().fit_transform(X)
model = AgglomerativeClustering(n_clusters=4, linkage="ward")
labels = model.fit_predict(X_scaled)
\`\`\`

## Evaluation
Same cluster evaluation tools as K-Means (Silhouette Score, Davies-Bouldin Index).

## Common Mistakes
> ❌ Applying it to very large datasets without checking computational cost first.
> ❌ Picking \`linkage="single"\` by default — it's prone to a "chaining" effect that can merge distinct clusters through a thin bridge of intermediate points; \`"ward"\` is usually a safer default.

## Comparison
Unlike K-Means, no need to commit to K before running the algorithm — you compute the full hierarchy once and can cut it at any level afterward. Slower than K-Means, and like other distance-based methods, needs scaled features.

## Quick Revision
See box below.

## Practice

{id:'gaussian-mixture', name:'Gaussian Mixture Models', pyClass:'GaussianMixture', family:'Clustering', difficulty:'advanced', days:[5],
blurb:'A probabilistic clustering approach — assumes data comes from a mix of overlapping Gaussian distributions.',
related:['kmeans'],
body:`
## What is a Gaussian Mixture Model?
A probabilistic clustering method that models the data as a mixture of several Gaussian (normal) distributions, and assigns each point a **probability** of belonging to each cluster, rather than a single hard assignment.

## Intuition
K-Means forces every point into exactly one cluster with a hard boundary. GMM instead says "this point is 70% likely to be in cluster A and 30% likely to be in cluster B" — useful when cluster boundaries genuinely overlap.

## How it works
Uses the Expectation-Maximization (EM) algorithm: it alternates between estimating the probability each point belongs to each Gaussian component (E-step), and updating each component's mean/covariance/weight to better fit those probability-weighted assignments (M-step), repeating until convergence.

## When should I use it?
You want soft (probabilistic) cluster assignments, or you suspect clusters are elliptical rather than perfectly spherical (GMM can model different covariance shapes per cluster, unlike K-Means).

## When should I avoid it?
Very high-dimensional data (covariance estimation becomes unstable), or when you specifically want simple, fast, hard cluster assignments — K-Means will be quicker and simpler.

## Important Parameters
- \`n_components\` — number of Gaussian components (analogous to K in K-Means).
- \`covariance_type\` — \`"full"\` (each cluster its own shape/orientation, most flexible), \`"tied"\`, \`"diag"\`, \`"spherical"\` (most restrictive, closest to K-Means' assumption).

## Training
\`\`\`python
from sklearn.mixture import GaussianMixture

model = GaussianMixture(n_components=4, covariance_type="full", random_state=42)
model.fit(X_scaled)
labels = model.predict(X_scaled)           # hard assignment
probabilities = model.predict_proba(X_scaled)  # soft assignment
\`\`\`

## Evaluation
GMM offers **BIC/AIC** (\`model.bic(X)\`, \`model.aic(X)\`) as principled ways to help choose \`n_components\` — lower is better, balancing fit quality against model complexity.

## Common Mistakes
> ❌ Using \`covariance_type="full"\` on high-dimensional data without enough samples — the number of parameters to estimate grows quickly and can overfit or fail to converge.
> ❌ Ignoring the soft probabilities and only using hard \`predict()\` labels when the overlapping-boundary information was actually the reason to choose GMM in the first place.

## Comparison
More flexible than K-Means (elliptical clusters, soft assignments, probabilistic interpretation) but more computationally expensive and prone to instability in high dimensions.

## Quick Revision

## Practice

{id:'pca', name:'PCA', pyClass:'PCA', family:'Dimensionality Reduction', difficulty:'intermediate', days:[3],
blurb:'Compresses many correlated features into fewer new ones that capture most of the original variance.',
related:['truncatedsvd','feature-scaling','kmeans'],
body:`
## What is PCA?
"Principal Component Analysis" — a technique that transforms your original (often correlated) features into a smaller set of new, uncorrelated features (principal components), ordered by how much of the data's variance they capture.

## Intuition
If "square footage" and "number of rooms" are highly correlated, they're carrying a lot of duplicate information. PCA finds new axes — combinations of your original features — that capture the most spread (variance) in the data using as few dimensions as possible.

## How it works
PCA finds the directions (principal components) along which the data varies the most, via eigendecomposition of the covariance matrix (or SVD). The first component captures the most variance, the second captures the most *remaining* variance while being orthogonal to the first, and so on.

## When should I use it?
High-dimensional data with correlated features, when you want to speed up downstream modeling, reduce overfitting risk from too many features, or visualize high-dimensional data in 2D/3D.

## When should I avoid it?
You need to preserve feature interpretability — principal components are linear combinations of original features and lose direct meaning. Also less useful if your features are already largely uncorrelated (there's little redundancy to compress).

## Important Parameters
- \`n_components\` — how many components to keep. Can be an integer, or a float like \`0.95\` to automatically keep enough components to explain 95% of the variance.

## Practical Example
Compressing 100 gene-expression features down to 10 principal components before feeding them into a classifier, or visualizing a high-dimensional customer dataset in 2D to spot clusters.

## Training
\`\`\`python
from sklearn.decomposition import PCA
from sklearn.preprocessing import StandardScaler
from sklearn.pipeline import Pipeline

pca_pipeline = Pipeline([("scaler", StandardScaler()), ("pca", PCA(n_components=0.95, random_state=42))])
X_reduced = pca_pipeline.fit_transform(X_train)
print("Components kept:", pca_pipeline.named_steps["pca"].n_components_)
\`\`\`

## Evaluation
\`\`\`python
print(pca_pipeline.named_steps["pca"].explained_variance_ratio_)   # variance captured per component
\`\`\`

## Common Mistakes
> ❌ Not scaling features before PCA — since PCA is variance-based, an unscaled large-range feature will dominate the components regardless of its actual importance.
> ❌ Fitting PCA on the full dataset (including test) before splitting — same leakage risk as any other preprocessing step.
> ❌ Using PCA purely for "dimensionality reduction" without checking how much variance is actually retained — sometimes it discards more signal than expected.

## Comparison
\`TruncatedSVD\` is PCA's close cousin, used specifically for sparse data (like TF-IDF text matrices) where PCA's centering step would break sparsity.

## Quick Revision
See box below.

## Practice
Quiz below.

{id:'truncatedsvd', name:'Truncated SVD', pyClass:'TruncatedSVD', family:'Dimensionality Reduction', difficulty:'intermediate', days:[3],
blurb:'PCA\'s sparse-data-friendly cousin — the standard dimensionality reduction choice after TF-IDF.',
related:['pca','text-vectorization'],
body:`
## What is Truncated SVD?
A dimensionality reduction technique very similar to PCA, but it works directly on the data matrix via Singular Value Decomposition **without centering it first** — which makes it suitable for sparse matrices, most commonly TF-IDF text representations.

## Intuition
Standard PCA's mean-centering step turns a sparse matrix (mostly zeros, like TF-IDF output) into a dense one, which can be extremely memory-expensive for large text datasets. Truncated SVD skips centering, staying sparse-friendly, while still finding the directions of greatest variance.

## How it works
Directly factorizes the data matrix into singular vectors and values via SVD, keeping only the top \`n_components\` — conceptually similar to PCA's eigendecomposition approach, but operating without a centering step.

## When should I use it?
Immediately after \`TfidfVectorizer\`/\`CountVectorizer\` on text data, when the resulting sparse matrix is too high-dimensional to model directly — this combination is often called "Latent Semantic Analysis" (LSA) in an NLP context.

## When should I avoid it?
Dense, already-low-dimensional numeric data — plain PCA is the more standard, more interpretable choice there.

## Important Parameters
- \`n_components\` — number of components to keep (must be less than the number of features).

## Practical Example
Reducing a 20,000-dimensional TF-IDF matrix from a document corpus down to 100 latent topics/components before clustering or classifying documents.

## Training
\`\`\`python
from sklearn.feature_extraction.text import TfidfVectorizer
from sklearn.decomposition import TruncatedSVD
from sklearn.pipeline import Pipeline

model = Pipeline([("tfidf", TfidfVectorizer(max_features=20000)), ("svd", TruncatedSVD(n_components=100, random_state=42))])
X_reduced = model.fit_transform(text_data)
\`\`\`

## Common Mistakes
> ❌ Using plain PCA on a sparse TF-IDF matrix instead of TruncatedSVD — this forces the matrix to become dense, often blowing up memory usage unnecessarily.
> ❌ Picking \`n_components\` arbitrarily — check \`explained_variance_ratio_\` to see how much signal is retained, same as PCA.

## Comparison
Functionally very close to PCA, but the sparse-data compatibility is the entire reason it exists as a separate tool — always reach for it (not PCA) after TF-IDF/CountVectorizer.

## Quick Revision
See box below.

## Practice
Quiz below.
`,

{id:'isolation-forest', name:'Isolation Forest', pyClass:'IsolationForest', family:'Anomaly Detection', difficulty:'intermediate', days:[5],
blurb:'Detects outliers by measuring how easy they are to isolate with random splits — anomalies isolate fast.',
related:['local-outlier-factor','one-class-svm','outliers'],
body:`
## What is Isolation Forest?
An anomaly detection algorithm built on the insight that outliers are easier to "isolate" than normal points: it builds random trees that split data randomly, and points that get isolated (end up alone) in very few splits are flagged as anomalies.

## Intuition
Imagine randomly partitioning your data with random cuts. A normal point, surrounded by many similar neighbors, takes many cuts to isolate. An outlier, sitting far from everything else, can often be isolated in just a couple of random cuts — the average path length to isolate a point becomes the anomaly score.

## How it works
Builds an ensemble of random trees ("isolation trees"), each splitting on a random feature at a random threshold. For each point, average the path length (number of splits) needed to isolate it across all trees — shorter average path length means more anomalous.

## When should I use it?
Fraud detection, network intrusion detection, defect detection — any scenario needing to flag rare, unusual points in mostly-normal data, especially at moderate-to-large scale (it scales well).

## When should I avoid it?
Very low-dimensional data where simpler statistical methods (z-score, IQR) are sufficient and more interpretable, or when anomalies aren't really "isolated" in feature space but instead form their own dense sub-cluster (Isolation Forest specifically targets *sparse/isolated* points).

## Important Parameters
- \`n_estimators\` — number of isolation trees.
- \`contamination\` — expected proportion of outliers in the data; used to set the decision threshold. Set based on domain knowledge, or leave as \`"auto"\`.
- \`max_samples\` — number of samples used to build each tree.

## Training
\`\`\`python
from sklearn.ensemble import IsolationForest

model = IsolationForest(n_estimators=200, contamination=0.02, random_state=42)
model.fit(X_train)
predictions = model.predict(X_test)   # 1 = normal, -1 = anomaly
scores = model.decision_function(X_test)   # lower = more anomalous
\`\`\`

## Common Mistakes
> ❌ Setting \`contamination\` far off from the true anomaly rate — this directly shifts the decision boundary and can flag far too many or too few points.
> ❌ Treating anomaly detection output as a definitive answer rather than a prioritized list for human review, in most real-world deployments.

## Comparison
Generally scales better to large/high-dimensional data than Local Outlier Factor, and doesn't require a clean "normal" boundary shape like One-Class SVM does.

## Quick Revision
See box below.

## Practice

{id:'local-outlier-factor', name:'Local Outlier Factor', pyClass:'LocalOutlierFactor', family:'Anomaly Detection', difficulty:'intermediate', days:[5],
blurb:'Flags points whose local density is much lower than their neighbors\' — good for varying-density data.',
related:['isolation-forest','one-class-svm','knn'],
body:`
## What is Local Outlier Factor (LOF)?
An anomaly detection method that compares each point's local density to the local density of its neighbors — points sitting in a sparser region than their neighbors are flagged as anomalies.

## Intuition
A point isn't necessarily anomalous just because it's far from the global center of the data — it might be normal within its own local neighborhood. LOF specifically looks at *relative*, local density, which makes it well-suited to datasets with clusters of very different densities.

## How it works
For each point, it compares its density (based on distance to its K nearest neighbors) to the average density of those neighbors. A LOF score near 1 means similar density to neighbors (normal); a score significantly greater than 1 means the point is in a notably sparser region than its neighbors (anomalous).

## When should I use it?
Data with clusters of varying densities, where a "global" anomaly detector (like Isolation Forest, which doesn't account for local density variation as directly) might miss locally-unusual points.

## When should I avoid it?
Very large datasets — LOF's distance computations don't scale as gracefully as Isolation Forest's tree-based approach. Also requires feature scaling, being distance-based.

## Important Parameters
- \`n_neighbors\` — how many neighbors define "local" density. Analogous to K in KNN.
- \`contamination\` — expected proportion of outliers, same role as in Isolation Forest.
- \`novelty\` — set to \`True\` if you want to use \`.predict()\` on new data after fitting (rather than only detecting outliers within the training set itself).

## Training
\`\`\`python
from sklearn.neighbors import LocalOutlierFactor
from sklearn.preprocessing import StandardScaler

X_scaled = StandardScaler().fit_transform(X_train)
model = LocalOutlierFactor(n_neighbors=20, contamination=0.02, novelty=True)
model.fit(X_scaled)
predictions = model.predict(X_test_scaled)   # 1 = normal, -1 = anomaly
\`\`\`

## Common Mistakes
> ❌ Forgetting to set \`novelty=True\` when you intend to score *new* data after fitting — without it, LOF only supports scoring the training set itself.
> ❌ Not scaling features — same distance-sensitivity issue as KNN.

## Comparison
More sensitive to local density variation than Isolation Forest, at the cost of worse scalability to very large datasets.

## Quick Revision
See box below.

## Practice

},

{id:'one-class-svm', name:'One-Class SVM', pyClass:'OneClassSVM', family:'Anomaly Detection', difficulty:'advanced', days:[5],
blurb:'Learns a boundary around "normal" data and flags anything outside it — SVM adapted for anomaly detection.',
related:['svm','isolation-forest'],
body:`
## What is One-Class SVM?
An adaptation of the SVM idea for anomaly/novelty detection: instead of separating two classes, it learns a boundary that encloses the "normal" data as tightly as reasonably possible, flagging anything outside that boundary as an anomaly.

## Intuition
Trained only on (assumed) normal data, it tries to draw the tightest reasonable boundary around it, using the same kernel-trick machinery as classification SVM to allow non-linear boundary shapes.

## How it works
Uses the RBF kernel (by default) to map data into a higher-dimensional space, then finds a boundary separating the bulk of the data from the origin, controlled by an \`nu\` parameter that roughly bounds the expected fraction of outliers/margin errors.

## When should I use it?
You have a reasonably clean set of "normal" examples to train on and want a flexible, kernel-based non-linear boundary around them — a good fit for moderate-sized datasets.

## When should I avoid it?
Large datasets — kernel SVM training doesn't scale well. Also sensitive to the choice of \`nu\` and \`gamma\`, which can require careful tuning to get a sensible boundary.

## Important Parameters
- \`nu\` — roughly, an upper bound on the fraction of training errors/outliers and a lower bound on the fraction of support vectors. Analogous to \`contamination\` in other anomaly methods.
- \`kernel\`, \`gamma\` — same role as in classification SVM.

## Training
\`\`\`python
from sklearn.svm import OneClassSVM
from sklearn.preprocessing import StandardScaler

X_scaled = StandardScaler().fit_transform(X_train_normal_only)
model = OneClassSVM(kernel="rbf", nu=0.02, gamma="scale")
model.fit(X_scaled)
predictions = model.predict(X_test_scaled)   # 1 = normal, -1 = anomaly
\`\`\`

## Common Mistakes
> ❌ Training on data that already contains a meaningful number of anomalies without accounting for it — ideally, train primarily on known-normal data.
> ❌ Not scaling features, and not tuning \`gamma\`/\`nu\` together, same issues as classification SVM.

## Comparison
More flexible boundary shapes than simpler statistical methods, but slower to train than Isolation Forest on larger datasets, and generally more sensitive to hyperparameter choices.

## Quick Revision
See box below.

## Practice
